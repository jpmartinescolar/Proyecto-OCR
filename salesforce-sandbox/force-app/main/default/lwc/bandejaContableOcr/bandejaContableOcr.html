<template>
    <main class="bc-main">
        <section class="bc-card">
            <div class="bc-cabecera">
                <div class="bc-icono"><lightning-icon icon-name={iconoTitulo} size="small" variant="inverse"></lightning-icon></div>
                <div class="bc-titulos">
                    <template lwc:if={agrupar}><div class="bc-eyebrow">OCR · Listado documentos</div></template>
                    <h1 class="bc-titulo">{titulo}</h1>
                </div>
                <span class="bc-ejemplo" title="Los documentos, su situación fiscal y los duplicados saldrán del procesamiento; ahora son de ejemplo a partir de los archivos subidos">Datos de ejemplo</span>
                <button class={claseAgrupar} onclick={toggleAgrupado}>
                    <lightning-icon icon-name="utility:company" size="x-small"></lightning-icon>Agrupar por empresas
                </button>
                <template lwc:if={empresaFiltro}>
                    <button class="bc-chip bc-chip-filtro" onclick={quitarEmpresa}>Empresa: {empresaFiltro} <span>×</span></button>
                </template>
            </div>

            <template lwc:if={cargando}>
                <div class="bc-spinner"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
            </template>
            <template lwc:if={error}>
                <div class="bc-vacio bc-rojo">{error}</div>
            </template>

            <!-- 04 · Recuento por empresa -->
            <template lwc:if={agrupar}>
                <div class="bc-barra">{contadorEmpresas}</div>
                <template lwc:if={sinEmpresas}>
                    <div class="bc-vacio">Todavía no hay documentos OCR.</div>
                </template>
                <template lwc:if={hayEmpresas}>
                    <div class="bc-tabla-wrap">
                        <table class="bc-tabla">
                            <thead>
                                <tr>
                                    <th class="bc-primera">Empresa</th>
                                    <th class="bc-derecha">Pendientes</th>
                                    <th class="bc-derecha bc-ultima">Total OCR documentos</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={empresas} for:item="e">
                                    <tr key={e.id}>
                                        <td class="bc-primera"><a class="bc-enlace" href="#" data-id={e.id} onclick={filtrarEmpresa}>{e.empresa}</a></td>
                                        <td class="bc-derecha bc-num">{e.pendientes}</td>
                                        <td class="bc-derecha bc-num bc-fuerte bc-ultima">{e.total}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </template>

            <!-- 03 · Listado de documentos -->
            <template lwc:else>
                <div class="ocr-tipos">
                    <template for:each={tipos} for:item="t">
                        <button key={t.label} class={t.clase} data-valor={t.label} onclick={handleTipo}>{t.label}<span class={t.claseN}>{t.n}</span></button>
                    </template>
                </div>
                <div class="bc-barra">
                    <span>{contadorTxt}</span>
                    <div class="ocr-situaciones">
                        <template for:each={situaciones} for:item="s">
                            <button key={s.s} class={s.clase} data-valor={s.s} onclick={handleSituacion}><span class={s.claseDot}></span>{s.label}</button>
                        </template>
                    </div>
                    <div class="bc-filtros">
                        <template lwc:if={verMotivo}>
                            <select class="ocr-motivo" onchange={handleMotivo}>
                                <template for:each={motivos} for:item="m"><option key={m.v} value={m.v} selected={m.selected}>{m.l}</option></template>
                            </select>
                        </template>
                        <template for:each={filtros} for:item="f">
                            <button key={f.valor} class={f.clase} data-valor={f.valor} onclick={handleFiltro}>{f.valor}</button>
                        </template>
                    </div>
                    <input class="bc-buscar" type="search" placeholder="Buscar en esta lista…" value={busqueda} oninput={handleBuscar}>
                </div>
                <template lwc:if={sinFilas}>
                    <div class="bc-vacio">No hay documentos con este filtro.</div>
                </template>
                <template lwc:if={hayFilas}>
                    <div class="bc-tabla-wrap">
                        <table class="bc-tabla">
                            <thead>
                                <tr>
                                    <th class="bc-primera">Fecha de creación</th>
                                    <th class="bc-derecha">Nº días</th>
                                    <th>Nº documento</th>
                                    <th>Nombre del archivo</th>
                                    <th>Tipo</th>
                                    <th>Formato</th>
                                    <th>Estado</th>
                                    <th>Situación fiscal</th>
                                    <th>Bandeja contable</th>
                                    <th class="bc-ultima">Empresa</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={grupos} for:item="g">
                                    <template lwc:if={g.cabecera}>
                                        <tr key={g.key} class="ocr-grupo" data-id={g.key} onclick={toggleGrupo}>
                                            <td colspan="10" class="bc-primera">
                                                <div class="ocr-grupo-fila">
                                                    <span class={g.claseFlecha}>›</span>
                                                    <span class="ocr-grupo-nombre">{g.empresa}</span>
                                                    <span class="ocr-grupo-n">{g.contador}</span>
                                                    <template lwc:if={g.riesgo}><span class="bc-pill bc-pill-pendiente">{g.riesgo}</span></template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template lwc:if={g.abierto}>
                                        <template for:each={g.filas} for:item="d">
                                            <tr key={d.id}>
                                                <td class="bc-primera bc-num bc-nowrap">{d.fechaTxt}</td>
                                                <td class={d.claseDias}>{d.dias}</td>
                                                <td><a class="bc-enlace" href="#" data-id={d.id} onclick={abrirDocumento}>{d.numero}</a></td>
                                                <td class="bc-fuerte">{d.nombre}</td>
                                                <td><span class={d.claseTipo}>{d.tipoTxt}</span></td>
                                                <td>{d.formato}</td>
                                                <td><span class={d.claseEstado}>{d.estadoTxt}</span></td>
                                                <td>
                                                    <div class="ocr-sit-celda" title={d.sitTip}>
                                                        <span class={d.claseSit}><template lwc:if={d.conRiesgo}>!</template><template lwc:else>✓</template></span>
                                                        <span class={d.claseSitTxt}>{d.sitTxt}</span>
                                                    </div>
                                                </td>
                                                <td><a class="bc-enlace" href="#" data-id={d.bandejaId} onclick={abrirBandeja}>{d.bandejaNumero}</a></td>
                                                <td class="bc-ultima"><a class="bc-enlace-neutro" href="#" data-id={d.empresaId} onclick={abrirEmpresa}>{d.empresa}</a></td>
                                            </tr>
                                        </template>
                                    </template>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </template>
        </section>
    </main>
</template>
