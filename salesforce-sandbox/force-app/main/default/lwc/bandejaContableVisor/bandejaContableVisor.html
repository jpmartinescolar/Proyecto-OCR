<template>
    <div class="vis-barra">
        <div class="vis-grupo" role="group" aria-label="Zoom">
            <button class="vis-herramienta" title="Reducir el zoom" aria-label="Reducir el zoom" disabled={sinMenos} onclick={menosZoom}>−</button>
            <button class="vis-zoom" title="Ajustar al ancho" onclick={ajustar}>{zoomTxt}</button>
            <button class="vis-herramienta" title="Aumentar el zoom" aria-label="Aumentar el zoom" disabled={sinMas} onclick={masZoom}>+</button>
        </div>
        <button class={claseAmpliar} title={tituloAmpliar} aria-pressed={ampliadoTxt} onclick={toggleAmpliar}>
            <lightning-icon icon-name="utility:zoomin" size="xx-small"></lightning-icon>Ampliar
        </button>
        <button class="vis-herramienta" title="Girar 90°" onclick={girar}>
            <lightning-icon icon-name="utility:rotate" size="xx-small"></lightning-icon>Girar
        </button>
        <div class="vis-grupo" role="group" aria-label="Páginas">
            <template lwc:if={conPaginas}>
                <button class="vis-herramienta vis-flecha" title="Página anterior" aria-label="Página anterior" disabled={sinAnterior} onclick={anterior}>‹</button>
            </template>
            <span class="vis-pagina">{paginaTxt}</span>
            <template lwc:if={conPaginas}>
                <button class="vis-herramienta vis-flecha" title="Página siguiente" aria-label="Página siguiente" disabled={sinSiguiente} onclick={siguiente}>›</button>
            </template>
        </div>
        <button class="vis-descargar" title="Descargar el documento" disabled={sinDescarga} onclick={descargar}>
            <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>Descargar
        </button>
    </div>
    <template lwc:if={ampliado}>
        <div class="vis-fondo" onclick={cerrarAmpliado}></div>
        <div class="vis-ampliado-barra" style={estiloBarraAmpliado}>
            <lightning-icon icon-name="utility:zoomin" size="xx-small"></lightning-icon>
            <span class="vis-ampliado-titulo">Vista ampliada</span>
            <span class="vis-ampliado-ayuda">Esc o clic fuera para volver</span>
            <button class="vis-restaurar" title="Volver al tamaño normal (Esc)" onclick={cerrarAmpliado}>
                <lightning-icon icon-name="utility:contract" size="xx-small"></lightning-icon>Restaurar
            </button>
        </div>
    </template>
    <div class={claseMesa} style={estiloMesa} lwc:ref="mesa" onclick={pulsarMesa}>
        <template lwc:if={conLupa}>
            <button class="vis-lupa" title="Ampliar el documento" aria-label="Ampliar el documento" onclick={ampliarDesdeLupa}>
                <lightning-icon icon-name="utility:zoomin" size="x-small"></lightning-icon>
            </button>
        </template>
        <template lwc:if={cargandoPdf}><div class="vis-aviso">Cargando documento…</div></template>
        <template for:each={marcos} for:item="m">
            <iframe key={m.key} class="vis-marco" src={m.src} style={estiloMarco} title="Documento original"></iframe>
        </template>
        <template lwc:if={esImagen}>
            <img class="vis-imagen" src={url} alt={nombre} style={estiloImagen}>
        </template>
        <template lwc:if={sinArchivo}>
            <div class="vis-papel" style={estiloPapel}><slot></slot></div>
        </template>
    </div>
</template>
