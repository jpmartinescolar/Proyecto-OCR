<template>
    <div class="pyg-container">

        <!-- HEADER -->
        <div class="pyg-header">
            <div class="pyg-header-left">
                <div class="pyg-icon">
                    <lightning-icon icon-name="standard:account_info" size="medium"></lightning-icon>
                </div>
                <div>
                    <h1 class="pyg-title">Libro Mayor</h1>
                    <p class="pyg-subtitle">Apuntes por cuenta con saldo acumulado · Plan General Contable</p>
                </div>
            </div>
            <div class="pyg-header-right">
                <template if:true={hasRows}>
                    <lightning-button label="Exportar Excel"
                                      icon-name="utility:download"
                                      variant="brand-outline"
                                      class="slds-m-right_x-small"
                                      onclick={exportarExcel}></lightning-button>
                </template>
                <lightning-button-icon icon-name="utility:refresh"
                                       alternative-text="Refrescar"
                                       variant="border-filled"
                                       onclick={handleRefresh}></lightning-button-icon>
            </div>
        </div>

        <!-- FILTROS (izquierda) + GRÁFICO (derecha) -->
        <div class="lm-top">
        <div class="pyg-filtros lm-filtros">
            <div class="pyg-filtros-titulo">
                <div class="pyg-toggles">
                    <span class="pyg-toggle-label">Simulación</span>
                    <button class={simTodasCls}  data-value="Todas"             onclick={setSimulacion}>Todas</button>
                    <button class={simNoCls}     data-value="No"                onclick={setSimulacion}>No</button>
                    <button class={simIvaCls}    data-value="Si"                onclick={setSimulacion}>Sí. IVA</button>
                    <button class={simTransfCls} data-value="Sí. Transferencia" onclick={setSimulacion}>Sí. Transferencia</button>

                    <span class="pyg-toggle-label">Extraordinarios</span>
                    <button class={extTodasCls} data-value="Todas" onclick={setExtraordinarios}>Todas</button>
                    <button class={extSiCls}    data-value="Si"    onclick={setExtraordinarios}>Sí</button>
                    <button class={extNoCls}    data-value="No"    onclick={setExtraordinarios}>No</button>

                    <span class="pyg-toggle-label">Check</span>
                    <button class={chkTodosCls} data-value="Todos" onclick={setCheck}>Todos</button>
                    <button class={chkSiCls}    data-value="Si"    onclick={setCheck}>Sí</button>
                    <button class={chkNoCls}    data-value="No"    onclick={setCheck}>No</button>

                    <span class="pyg-toggle-label">Incidencia</span>
                    <button class={incTodosCls} data-value="Todos" onclick={setIncidencia}>Todos</button>
                    <button class={incSiCls}    data-value="Si"    onclick={setIncidencia}>Sí</button>
                    <button class={incNoCls}    data-value="No"    onclick={setIncidencia}>No</button>

                    <span class="pyg-toggle-label" title="Aplica al navegar Anterior/Siguiente">Acumulado (nav.)</span>
                    <button class={acuTodasCls}  data-value="Todas"    onclick={setAcumuladoNav}>Todas</button>
                    <button class={acuNoCeroCls} data-value="NoCero"   onclick={setAcumuladoNav}>≠ 0</button>
                    <button class={acuPosCls}    data-value="Positivo" onclick={setAcumuladoNav}>&gt; 0</button>
                </div>
            </div>

            <div class="pyg-filtros-grid">
                <!-- Empresa titular multi-select obligatorio -->
                <div class={empresaDropdownClass}>
                    <label class="slds-form-element__label">
                        Empresa titular <span class="pyg-req">*</span>
                    </label>
                    <button class={empresaTriggerClass} type="button" onclick={toggleEmpresaDropdown}>
                        <span class="pyg-ms-trigger-text">{empresaTriggerLabel}</span>
                        <span class="pyg-ms-caret">▾</span>
                    </button>

                    <template if:true={showEmpresaDropdown}>
                        <div class="pyg-ms-backdrop" onclick={closeEmpresaDropdown}></div>
                        <div class="pyg-ms-panel" onclick={stopProp}>
                            <div class="pyg-ms-panel-head">
                                <input type="search"
                                       class="pyg-ms-search"
                                       placeholder="Buscar..."
                                       value={empresaFiltroBusqueda}
                                       oninput={handleEmpresaBusqueda} />
                                <div class="pyg-ms-actions">
                                    <button type="button" class="pyg-ms-link" onclick={handleEmpresaSelectAll}>Todas</button>
                                    <span>·</span>
                                    <button type="button" class="pyg-ms-link" onclick={handleEmpresaClearAll}>Ninguna</button>
                                </div>
                            </div>
                            <div class="pyg-ms-list">
                                <template for:each={empresaOptionsFiltradas} for:item="opt">
                                    <div key={opt.value}
                                         class={opt.optionClass}
                                         data-value={opt.value}
                                         onclick={handleEmpresaToggle}>
                                        <span class="pyg-ms-check"></span>
                                        <span class="pyg-ms-label">{opt.label}</span>
                                    </div>
                                </template>
                            </div>
                            <div class="pyg-ms-panel-foot">
                                <span class="pyg-ms-count">{empresaCount}</span>
                                <button type="button" class="slds-button slds-button_brand pyg-ms-apply" onclick={closeEmpresaDropdown}>Aplicar</button>
                            </div>
                        </div>
                    </template>
                </div>

                <lightning-input type="date" label="Desde" value={fechaDesde} onchange={handleFechaDesdeChange}></lightning-input>
                <lightning-input type="date" label="Hasta" value={fechaHasta} onchange={handleFechaHastaChange}></lightning-input>

                <!-- Cuenta contable (por título) — buscador por texto -->
                <div class={cuentaTitWrapClass}>
                    <label class="slds-form-element__label">Cuenta contable (por título)</label>
                    <button class={cuentaTitTriggerClass} type="button" onclick={toggleCuentaTitDropdown}>
                        <span class="pyg-ms-trigger-text">{cuentaTitTriggerLabel}</span>
                        <span class="pyg-ms-caret">▾</span>
                    </button>
                    <template if:true={showCuentaTitDropdown}>
                        <div class="pyg-ms-backdrop" onclick={closeCuentaTitDropdown}></div>
                        <div class="pyg-ms-panel" onclick={stopProp}>
                            <div class="pyg-ms-panel-head">
                                <input type="search" class="pyg-ms-search lm-search-tit" placeholder="Buscar por título..."
                                       value={cuentaTitBusqueda} oninput={handleCuentaTitBusqueda} />
                            </div>
                            <div class="pyg-ms-list">
                                <template if:true={sinEmpresa}>
                                    <div class="lm-ms-hint">Selecciona primero la <strong>Empresa titular</strong></div>
                                </template>
                                <template if:false={sinEmpresa}>
                                    <template for:each={cuentaTitFiltradas} for:item="opt">
                                        <div key={opt.id} class={opt.optionClass} data-id={opt.id} onclick={handleCuentaTitPick}>
                                            <span class="pyg-ms-label">{opt.label}</span>
                                            <span class="lm-ms-num">{opt.numero}</span>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Cuenta contable (por número) — buscador por texto -->
                <div class={cuentaNumWrapClass}>
                    <label class="slds-form-element__label">Cuenta contable (por número)</label>
                    <button class={cuentaNumTriggerClass} type="button" onclick={toggleCuentaNumDropdown}>
                        <span class="pyg-ms-trigger-text">{cuentaNumTriggerLabel}</span>
                        <span class="pyg-ms-caret">▾</span>
                    </button>
                    <template if:true={showCuentaNumDropdown}>
                        <div class="pyg-ms-backdrop" onclick={closeCuentaNumDropdown}></div>
                        <div class="pyg-ms-panel" onclick={stopProp}>
                            <div class="pyg-ms-panel-head">
                                <input type="search" class="pyg-ms-search lm-search-num" placeholder="Buscar por número..."
                                       value={cuentaNumBusqueda} oninput={handleCuentaNumBusqueda} />
                            </div>
                            <div class="pyg-ms-list">
                                <template if:true={sinEmpresa}>
                                    <div class="lm-ms-hint">Selecciona primero la <strong>Empresa titular</strong></div>
                                </template>
                                <template if:false={sinEmpresa}>
                                    <template for:each={cuentaNumFiltradas} for:item="opt">
                                        <div key={opt.id} class={opt.optionClass} data-id={opt.id} onclick={handleCuentaNumPick}>
                                            <span class="pyg-ms-label">{opt.label}</span>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="lm-generar-row">
                <lightning-button label="Limpiar" icon-name="utility:clear" variant="neutral"
                                  title="Borra filtros y resultados para empezar de cero"
                                  onclick={handleLimpiar} class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Generar" icon-name="utility:apex"
                                  variant="brand" onclick={handleGenerar}></lightning-button>
            </div>
        </div>
        <!-- /filtros izquierda -->

        <template if:true={hasChart}>
            <div class="lm-chart-card">
                <template if:true={isDrilled}>
                    <div class="lm-drill-corner">
                        <span class="lm-drill-label">Mostrando sólo: <strong>{drillLabel}</strong></span>
                        <button class="lm-drill-reset" onclick={handleResetDrill} title="Ver todo el periodo">
                            <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon> Ver todo
                        </button>
                    </div>
                </template>
                <div class="lm-chart-card-title">Evolución <span class="lm-chart-card-sub">{periodoLabel}</span></div>
                <div class={chartClass}>
                    <div class="lm-chart-zero"><span class="lm-chart-zero-label">0</span></div>
                    <template for:each={chartGroups} for:item="g">
                        <div key={g.key} class="lm-chart-group">
                            <div class="lm-chart-bars">
                                <template for:each={g.bars} for:item="b">
                                    <div key={b.key} class="lm-chart-col" title={b.titleAttr}
                                         data-ym={b.ym} onclick={handleBarClick}>
                                        <div class="lm-chart-top">
                                            <div class="lm-chart-bar lm-bar-top" style={b.posStyle}></div>
                                        </div>
                                        <div class="lm-chart-bot">
                                            <div class="lm-chart-bar lm-bar-bot" style={b.negStyle}></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="lm-chart-label">{g.label}</div>
                        </div>
                    </template>
                </div>
                <template if:true={multiAnio}>
                    <div class="lm-chart-legend">
                        <template for:each={chartLegend} for:item="l">
                            <span key={l.year} class="lm-legend-item">
                                <span class="lm-legend-swatch" style={l.swatchStyle}></span>{l.year}
                            </span>
                        </template>
                    </div>
                </template>
            </div>
        </template>
        </div>
        <!-- /lm-top -->

        <!-- AVISOS DE CUADRE -->
        <c-avisos-cuadre params={avisosParams}></c-avisos-cuadre>

        <!-- BARRA DE CONTEXTO -->
        <div class="pyg-contextbar">
            <span><strong>Empresa:</strong> {empresaLabel}</span>
            <span class="pyg-divider">·</span>
            <span><strong>Periodo:</strong> {periodoLabel}</span>
        </div>

        <!-- LOADING -->
        <template if:true={loading}>
            <div class="pyg-loading"><lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner></div>
        </template>

        <!-- ERROR -->
        <template if:true={hasError}>
            <div class="pyg-error">
                <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                <span>{error}</span>
            </div>
        </template>

        <!-- CABECERA DE CUENTA + NAVEGACIÓN (visible aunque no haya apuntes) -->
        <template if:true={showCuentaBar}>
            <div class="lm-cuentabar">
                <div class="lm-nav">
                    <lightning-button label="Anterior" icon-name="utility:chevronleft" icon-position="left"
                                      variant="neutral" onclick={handleAnterior}></lightning-button>
                    <lightning-button label="Siguiente" icon-name="utility:chevronright" icon-position="right"
                                      variant="neutral" onclick={handleSiguiente}></lightning-button>
                    <template if:true={navLoading}>
                        <div class="lm-nav-spinner">
                            <lightning-spinner size="small" variant="brand" alternative-text="Cargando"></lightning-spinner>
                        </div>
                    </template>
                </div>
                <div class="lm-cuenta-info">
                    <a href="javascript:void(0);" class="lm-cuenta-badge"
                       data-recordid={genCuentaId}
                       data-objectname="Plan_general_contable__c"
                       onclick={navigateToRecordNewTab}
                       title="Abrir cuenta contable en una pestaña nueva">{genCuentaNumero}</a>
                    <span class="lm-cuenta-titulo">{genCuentaTitulo}</span>
                </div>

                <template if:true={showAnalitica}>
                    <div class="lm-analitica">
                        <template if:true={apartadoOperaciones}>
                            <lightning-icon icon-name="utility:warning" variant="warning" size="small"
                                            alternative-text="Aviso" title="Apartado: Operaciones"
                                            class="lm-anal-warn"></lightning-icon>
                        </template>
                        <div class="lm-anal-texts">
                            <span class="lm-anal-item"><span class="lm-anal-label">Apartado:</span> {genCuentaApartado}</span>
                            <span class="lm-anal-item"><span class="lm-anal-label">Subapartado:</span> {genCuentaSubapartado}</span>
                        </div>
                    </div>
                </template>

                <div class={saldoBoxClass}>
                    <span class="lm-saldo-label">Saldo movimientos</span>
                    <span class="lm-saldo-val">{saldoFinal}</span>
                </div>
                <template if:true={showSaldoEfectos}>
                    <div class={saldoEfectosBoxClass}
                         title="Suma del importe de los efectos clientes en rojo (pendientes de cobro)">
                        <span class="lm-saldo-label">Saldo efectos clientes</span>
                        <span class="lm-saldo-val">{saldoEfectosRojosFmt}</span>
                    </div>
                </template>
                <template if:true={showSaldoEfectosProv}>
                    <div class={saldoEfectosProvBoxClass}
                         title="Suma del importe de los efectos proveedores pendientes (estado distinto de Conciliado, Remesa o Tarjeta)">
                        <span class="lm-saldo-label">Saldo efectos proveedores</span>
                        <span class="lm-saldo-val">{saldoEfectosProvFmt}</span>
                    </div>
                </template>
                <template if:true={showDiferenciaBox}>
                    <div class="lm-saldo-box lm-saldo-dif"
                         title="Diferencia entre el saldo de movimientos y el saldo de efectos">
                        <span class="lm-saldo-label">Diferencia</span>
                        <span class="lm-saldo-val">{diferenciaEfectosFmt}</span>
                    </div>
                </template>
            </div>
        </template>

        <!-- ESTADO INICIAL -->
        <template if:true={showInicial}>
            <div class="pyg-placeholder">
                <lightning-icon icon-name="utility:filterList" size="small" class="pyg-placeholder-icon"></lightning-icon>
                <span>{textoInicial} <strong>Generar</strong>.</span>
            </div>
        </template>

        <!-- PESTAÑAS Movimientos / Efectos clientes (solo cuentas 430) -->
        <template if:true={showSubTabs}>
            <div class="lm-subtabs">
                <button class={tabMovCls} data-value="mov" onclick={setSubTab}>Movimientos contables</button>
                <button class={tabEfeCls} data-value="efectos" onclick={setSubTab}>{tabEfeLabel}</button>
            </div>
        </template>

        <!-- TABLA -->
        <template if:true={showTablaMov}>
            <div class="pyg-tabla-wrap">
                <table class="pyg-tabla lm-tabla">
                    <thead>
                        <tr>
                            <th class="lm-th-fecha">FECHA</th>
                            <th class="lm-th-inc" title="Incidencia">INC.</th>
                            <th class="lm-th-apunte">Nº APUNTE</th>
                            <th class="lm-th-asiento">Nº ASIENTO</th>
                            <th class="lm-th-desc">DESCRIPCIÓN</th>
                            <th class="pyg-th-num">DEBE</th>
                            <th class="pyg-th-num">HABER</th>
                            <th class="pyg-th-num lm-th-saldo">SALDO</th>
                            <th class="lm-th-extracto">EXTRACTO BANCARIO</th>
                            <th class="lm-th-empresa">EMPRESA TITULAR</th>
                            <th class="pyg-th-edit">ÁREA</th>
                            <th class="pyg-th-edit">DIRECTOR FACTURACIÓN</th>
                            <th class="pyg-th-edit">CAMPAÑA</th>
                            <th class="pyg-th-edit">
                                <div class="lm-check-th">
                                    <span>CHECK</span>
                                    <button class="lm-check-all-btn" type="button"
                                            title="Marcar como Sí el check de todos los apuntes en pantalla"
                                            onclick={handleMarcarTodosCheckSi}>Marcar Todos Sí</button>
                                </div>
                            </th>
                            <th class="lm-th-sim">SIM.</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TOTALES Debe / Haber, alineados bajo sus columnas, encima de los movimientos -->
                        <tr class="lm-totales-row">
                            <td colspan="5" class="lm-totales-label">{totalLabel}</td>
                            <td class="pyg-num">{totalDebe}</td>
                            <td class="pyg-num">{totalHaber}</td>
                            <td colspan="8"></td>
                        </tr>
                        <template for:each={rows} for:item="row">
                            <tr key={row.key} class={row.rowClass}>
                                <td class="lm-fecha">{row.fecha}</td>
                                <td class="lm-inc">
                                    <template if:true={row.incidenciaSi}>
                                        <lightning-icon icon-name="utility:warning" variant="error" size="x-small"
                                                        alternative-text="Incidencia: Sí" title="Incidencia: Sí"></lightning-icon>
                                    </template>
                                    <template if:true={row.incidenciaNo}>
                                        <span class="lm-inc-ok" title="Incidencia: No">
                                            <lightning-icon icon-name="utility:check" variant="inverse" size="xx-small"
                                                            alternative-text="Incidencia: No"></lightning-icon>
                                        </span>
                                    </template>
                                </td>
                                <td>
                                    <a href="javascript:void(0);" class="pyg-link"
                                       data-recordid={row.recordId}
                                       data-objectname={row.objectApiName}
                                       onclick={navigateToRecordNewTab}>{row.numeroApunte}</a>
                                </td>
                                <td class="lm-asiento">
                                    <template if:true={row.asientoId}>
                                        <a href="javascript:void(0);" class="pyg-link"
                                           data-recordid={row.asientoId}
                                           data-objectname="Asiento_contable__c"
                                           onclick={navigateToRecordNewTab}
                                           title="Abrir asiento en una pestaña nueva">{row.numeroAsiento}</a>
                                    </template>
                                    <template if:false={row.asientoId}>{row.numeroAsiento}</template>
                                </td>
                                <td class="pyg-desc">
                                    <template if:true={row.descLinkId}>
                                        <a href="javascript:void(0);" class="lm-desc-link"
                                           data-recordid={row.descLinkId}
                                           data-objectname={row.descLinkObject}
                                           onclick={navigateToRecordNewTab}
                                           title={row.descLinkTitle}>
                                            <div class="pyg-text-wrap">{row.descripcion}</div>
                                        </a>
                                    </template>
                                    <template if:false={row.descLinkId}>
                                        <div class="pyg-text-wrap">{row.descripcion}</div>
                                    </template>
                                </td>
                                <td class={row.debeClass}>{row.debe}</td>
                                <td class={row.haberClass}>{row.haber}</td>
                                <td class={row.saldoClass}><strong>{row.saldo}</strong></td>
                                <td class="lm-extracto">
                                    <template if:true={row.hayExtracto}>
                                        <a href="javascript:void(0);" class="pyg-link"
                                           data-recordid={row.extractoId}
                                           data-objectname="Extracto_bancario__c"
                                           onclick={navigateToRecordNewTab}
                                           title={row.extractoTitle}>{row.extractoNumero}</a>
                                    </template>
                                </td>
                                <td class="pyg-empresa"><div class="pyg-text-wrap pyg-text-wrap-empresa">{row.empresaTitular}</div></td>
                                <td class="pyg-cell-edit">
                                    <lightning-combobox variant="label-hidden" label="Área"
                                        value={row.area} options={areaEditOptions}
                                        data-rid={row.recordId} data-fld="area"
                                        onchange={handleEdit}></lightning-combobox>
                                </td>
                                <td class="pyg-cell-edit pyg-cell-edit-wide">
                                    <lightning-record-picker label="Director"
                                        placeholder="Buscar persona..."
                                        object-api-name="User" variant="label-hidden"
                                        value={row.directorFacturacionId}
                                        data-rid={row.recordId}
                                        onchange={handleEditDirector}></lightning-record-picker>
                                </td>
                                <td class="pyg-cell-edit pyg-cell-edit-wide">
                                    <lightning-record-picker label="Campaña"
                                        placeholder="Buscar campaña..."
                                        object-api-name="Campaign" variant="label-hidden"
                                        value={row.campaniaId}
                                        data-rid={row.recordId}
                                        onchange={handleEditCampania}></lightning-record-picker>
                                </td>
                                <td class="pyg-cell-edit lm-check-cell">
                                    <select class={row.checkSelectClass}
                                            data-rid={row.recordId} onchange={handleEditCheck}>
                                        <option value=""   selected={row.checkIsBlank}>—</option>
                                        <option value="No" selected={row.checkIsNo}>No</option>
                                        <option value="Si" selected={row.checkIsSi}>Sí</option>
                                    </select>
                                </td>
                                <td class="pyg-cell-edit lm-cell-sim">
                                    <lightning-combobox variant="label-hidden" label="Simulación"
                                        value={row.simulacion} options={simulacionEditOptions}
                                        data-rid={row.recordId} data-fld="simulacion"
                                        onchange={handleEdit}></lightning-combobox>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- EMPTY -->
        <template if:true={showEmptyMov}>
            <div class="pyg-empty">
                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                <span>No hay apuntes para esta selección.</span>
            </div>
        </template>

        <!-- EFECTOS CLIENTES (cuentas 430) -->
        <template if:true={efectosLoading}>
            <div class="pyg-loading"><lightning-spinner alternative-text="Cargando efectos" size="small"></lightning-spinner></div>
        </template>
        <template if:true={showTablaEfectos}>
            <div class="pyg-tabla-wrap">
                <table class="pyg-tabla lm-ef-tabla">
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th class="pyg-th-num">IMPORTE EFECTO</th>
                            <th>FECHA VENC. INICIAL</th>
                            <th>ESTADO</th>
                            <th>FACTURA EMITIDA</th>
                            <th>EFECTO ORIGEN DIVISIÓN</th>
                            <th>EFECTO COMPENSADO</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={efectos} for:item="ef">
                            <tr key={ef.key} class={ef.rowClass}>
                                <td>
                                    <a href="javascript:void(0);" class="lm-ef-link"
                                       data-recordid={ef.id} data-objectname="Reclamaci_n_de_impagados__c"
                                       onclick={navigateToRecordNewTab}
                                       title="Abrir el efecto en una pestaña nueva">{ef.numero}</a>
                                </td>
                                <td class="pyg-num">{ef.importe}</td>
                                <td>{ef.fechaVenc}</td>
                                <td>{ef.estado}</td>
                                <td>
                                    <template if:true={ef.hayFactura}>
                                        <a href="javascript:void(0);" class="lm-ef-link"
                                           data-recordid={ef.facturaId} data-objectname="Facturas__c"
