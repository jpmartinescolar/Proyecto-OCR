<template>
    <lightning-card title="Subir facturas · Test opción A" icon-name="utility:upload">
        <div slot="actions">
            <template lwc:if={simulado}>
                <lightning-badge label="Modo simulado (sin Google)"></lightning-badge>
            </template>
        </div>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={cargando}>
                <div class="stf-spinner"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
            </template>
            <template lwc:if={errorCarga}>
                <div class="slds-text-color_error">{errorCarga}</div>
            </template>

            <template lwc:if={contexto}>
                <!-- Empresa -->
                <template lwc:if={sinEmpresas}>
                    <div class="slds-box stf-aviso slds-m-bottom_small">
                        No tienes empresas asignadas. Pide que te asignen como asesor responsable
                        o como miembro del equipo de la cuenta.
                    </div>
                </template>
                <template lwc:if={empresaUnica}>
                    <div class="slds-form-element slds-m-bottom_small">
                        <span class="slds-form-element__label">Empresa</span>
                        <div class="slds-form-element__static">{empresaUnica.nombre} ({empresaUnica.cif})</div>
                    </div>
                </template>
                <template lwc:if={usarCombo}>
                    <lightning-combobox class="slds-m-bottom_small" label="Empresa" required
                                        placeholder="Selecciona la empresa" value={empresaId}
                                        options={empresaOpciones} disabled={trabajando}
                                        onchange={handleEmpresaCombo}></lightning-combobox>
                </template>
                <template lwc:if={usarPicker}>
                    <lightning-record-picker class="slds-m-bottom_small" label="Empresa" required
                                             object-api-name="Account" placeholder="Buscar empresa…"
                                             filter={pickerFiltro} disabled={trabajando}
                                             onchange={handleEmpresaPicker}></lightning-record-picker>
                </template>

                <!-- Tipo y observaciones -->
                <lightning-combobox class="slds-m-bottom_small" label="Tipo de documentación" required
                                    placeholder="Selecciona el tipo" value={tipo} options={tipoOpciones}
                                    disabled={trabajando} onchange={handleTipo}></lightning-combobox>
                <lightning-textarea class="slds-m-bottom_small" label="Observaciones" max-length="32768"
                                    value={observaciones} disabled={trabajando}
                                    onchange={handleObservaciones}></lightning-textarea>

                <!-- Archivos: sin límite de cantidad, se pueden ir añadiendo en varias tandas -->
                <lightning-input type="file" label="Adjuntar ficheros" multiple accept={accept}
                                 disabled={trabajando} onchange={handleArchivo}></lightning-input>
                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    PDF, ZIP, PNG, JPG, JPEG, XLSX o XLS. Sin límite de archivos. Máximo {maxBytesTxt} por archivo.
                </div>

                <template lwc:if={hayArchivos}>
                    <div class="stf-lista-titulo slds-m-top_medium">{totalArchivosTxt}</div>
                    <div class="stf-lista">
                        <template for:each={filasArchivos} for:item="a">
                            <div key={a.key} class={a.filaCls}>
                                <div class="stf-fila-cabecera">
                                    <div class="stf-fila-nombre" title={a.nombre}>{a.nombre}</div>
                                    <div class="stf-fila-tamano">{a.tamanoTxt}</div>
                                    <template lwc:if={a.permiteQuitar}>
                                        <lightning-button-icon icon-name="utility:close" variant="bare"
                                            alternative-text="Quitar" title="Quitar de la lista"
                                            data-key={a.key} onclick={quitarArchivo}></lightning-button-icon>
                                    </template>
                                </div>
                                <template lwc:if={a.esInvalido}>
                                    <div class="stf-fila-msg stf-fila-msg-error">{a.fileError}</div>
                                </template>
                                <template lwc:if={a.mostrarProgreso}>
                                    <lightning-progress-bar value={a.progreso} size="small"></lightning-progress-bar>
                                    <div class="stf-fila-msg">{a.progresoTxt}</div>
                                </template>
                                <template lwc:if={a.esOk}>
                                    <div class="stf-fila-msg stf-fila-msg-ok">
                                        <a href="javascript:void(0);" data-key={a.key} onclick={handleAbrirRegistro}>{a.numero}</a>
                                        · {a.mensaje}
                                    </div>
                                </template>
                                <template lwc:if={a.esError}>
                                    <div class="stf-fila-msg stf-fila-msg-error">
                                        {a.mensaje}
                                        <template lwc:if={a.permiteReintentar}>
                                            <a href="javascript:void(0);" data-key={a.key} onclick={reintentarUno}>Reintentar</a>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </template>
        </div>

        <div slot="footer" class="stf-footer">
            <template lwc:if={trabajando}>
                <lightning-button label="Cancelar" onclick={handleCancelar}></lightning-button>
            </template>
            <lightning-button variant="brand" label={botonSubirLabel} icon-name="utility:upload"
                              disabled={botonDeshabilitado} onclick={handleSubir}></lightning-button>
        </div>
    </lightning-card>
</template>
