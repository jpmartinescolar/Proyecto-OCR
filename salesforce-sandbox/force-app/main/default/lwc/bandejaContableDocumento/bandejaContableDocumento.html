<template>
    <main class="bc-main bc-main-ancho">
        <template lwc:if={cargando}>
            <div class="bc-card"><div class="bc-spinner"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div></div>
        </template>
        <template lwc:if={error}>
            <div class="bc-card">
                <div class="bc-vacio bc-rojo">{error}</div>
                <div class="bc-vacio"><a class="bc-enlace" href="#" onclick={volverABandeja}>Volver a la bandeja</a></div>
            </div>
        </template>

        <template lwc:if={listo}>
            <!-- ===== Cabecera ===== -->
            <section class="bc-card doc-cabecera">
                <div class="doc-cabecera-fila">
                    <div class="doc-icono"><lightning-icon icon-name="utility:file" size="x-small" variant="inverse"></lightning-icon></div>
                    <div class="doc-cabecera-titulos">
                        <div class="bc-migas doc-migas">
                            <a class="bc-enlace" href="#" onclick={irALista}>
                                <template lwc:if={v.desdeOcr}>OCR</template><template lwc:else>Bandeja contable</template>
                            </a>
                            <span>›</span>
                            <a class="bc-enlace" href="#" onclick={volverABandeja}>{v.doc.bandejaNumero}</a>
                            <span>›</span>
                            <span>{v.doc.numero}</span>
                        </div>
                        <div class="doc-titulo-fila">
                            <h1 class="doc-titulo">{v.titulo}</h1>
                            <span class={v.doc.claseEstado}><span class="doc-estado-punto"></span>{v.doc.estadoTxt}</span>
                            <div class="doc-tipo-bloque">
                                <span class="doc-etiqueta">Tipo de factura</span>
                                <div class={v.claseTipos}>
                                    <template for:each={v.tipos} for:item="t">
                                        <button key={t.t} class={t.clase} data-t={t.t} onclick={handleTipo}>{t.t}</button>
                                    </template>
                                </div>
                            </div>
                            <span class="bc-ejemplo" title="Los datos extraídos, reglas y skills son de ejemplo hasta que exista la extracción con IA (Fase 2)">Datos de ejemplo</span>
                        </div>
                    </div>
                    <div class="doc-acciones-cab">
                        <button class={v.claseRosetta} title="Chat sobre esta factura" onclick={toggleRosetta}>
                            <lightning-icon icon-name="utility:chat" size="xx-small"></lightning-icon>Rosetta IA
                        </button>
                        <button class="bc-boton-sec bc-boton-peq doc-boton-borrador" onclick={guardarBorrador}>Guardar borrador</button>
                        <template lwc:if={v.puedeReabrir}>
                            <button class="bc-boton-sec bc-boton-peq" onclick={reabrir}>Reabrir</button>
                        </template>
                        <template lwc:if={v.puedeCerrar}>
                            <div class="doc-desplegable">
                                <button class={v.claseBotonNc} onclick={toggleNc}>No contabilizar <span class="doc-flecha-abajo">▾</span></button>
                                <template lwc:if={v.nc}>
                                    <div class="doc-popover doc-popover-nc">
                                        <div class="doc-popover-cab">
                                            <span class="doc-popover-titulo">No contabilizar esta factura</span>
                                            <span class="doc-gris-peq">Elige el motivo. No se enviará al software de destino.</span>
                                        </div>
                                        <div class="doc-motivos">
                                            <template for:each={v.nc.motivos} for:item="m">
                                                <button key={m.label} class={m.clase} data-motivo={m.label} onclick={elegirMotivo}>
                                                    <span class={m.claseRadio}><span class="doc-radio-punto"></span></span>
                                                    <span class="doc-motivo-texto">
                                                        <span class="doc-motivo-fila"><span class="doc-motivo-label">{m.label}</span>
                                                            <template lwc:if={m.sugerido}><span class="doc-sugerido">Sugerido por la IA</span></template>
                                                        </span>
                                                        <span class="doc-gris-peq">{m.hint}</span>
                                                    </span>
                                                </button>
                                            </template>
                                        </div>
                                        <div class="doc-popover-cuerpo">
                                            <textarea class="doc-textarea" rows="2" placeholder="Comentario (opcional). Se guarda en Notas." value={v.nc.comentario} onchange={handleComentarioNc}></textarea>
                                            <label class="doc-check"><input type="checkbox" checked={v.nc.avisar} onchange={toggleAvisarNc}>Avisar al cliente del motivo</label>
                                        </div>
                                        <div class="doc-popover-pie">
                                            <button class="bc-boton-sec bc-boton-peq" onclick={toggleNc}>Cancelar</button>
                                            <button class={v.nc.claseOk} onclick={confirmarNc}>No contabilizar</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <button class={v.claseValidar} disabled={v.bloqueado} title={v.tituloValidar} onclick={validar}>
                            <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse"></lightning-icon>Validar factura
                        </button>
                    </div>
                </div>
                <div class="doc-meta">
                    <div class="doc-meta-item"><span class="doc-meta-label">Empresa</span><a class="bc-enlace doc-meta-valor" href="#" onclick={verEmpresa}>{v.meta.empresa}</a></div>
                    <div class="doc-meta-item"><span class="doc-meta-label">Archivo</span><span class="doc-meta-valor">{v.doc.nombre}</span></div>
                    <div class="doc-meta-item"><span class="doc-meta-label">Recibido</span><span class="doc-meta-valor">{v.meta.recibido}</span></div>
                    <div class="doc-meta-item" title={v.meta.extraccionTip}><span class="doc-meta-label">Extracción automática</span><span class="doc-meta-valor">{v.meta.extraccion}</span></div>
                    <div class="doc-meta-item"><span class="doc-meta-label">Software contabilidad destino
                        <template lwc:if={v.meta.softwareEjemplo}><span class="doc-ejemplo-mini">ejemplo</span></template></span>
                        <span class="doc-meta-valor doc-software">{v.meta.software}</span></div>
                    <div class="doc-nav">
                        <button class="bc-flecha doc-flecha" title="Anterior" onclick={anterior}>‹</button>
                        <span>{v.pos}</span>
                        <button class="bc-flecha doc-flecha" title="Siguiente" onclick={siguiente}>›</button>
                    </div>
                </div>
            </section>

            <div class="doc-grid">
                <!-- ===== Visor ===== -->
                <section class="bc-card doc-visor">
                    <c-bandeja-contable-visor url={v.visor.url} mime={v.visor.mime} nombre={v.visor.nombre}
                                              descarga-url={v.visor.descargaUrl} paginas={v.visor.paginas}>
                        <!-- Sin archivo que mostrar: vista de ejemplo del documento (resalta los campos al pasar por ellos) -->
                        <div class="doc-papel">
                            <span class="bc-ejemplo doc-papel-ejemplo">Datos de ejemplo</span>
                            <div class="doc-fila-sep">
                                <div class="doc-bloque">
                                    <span class="doc-marca doc-emisor" style={v.hl.emisor}>{v.x.emisor}</span>
                                    <div>NIF <span class="doc-marca" style={v.hl.nif}>{v.x.nif}</span></div>
                                    <span class="doc-marca" style={v.fijo.azul}>{v.x.dir}</span>
                                </div>
                                <div class="doc-bloque doc-bloque-der">
                                    <div class="doc-kind">{v.x.kind}</div>
                                    <div>Nº <span class="doc-marca" style={v.hl.numero}>{v.x.numero}</span></div>
                                </div>
                            </div>
                            <div class="doc-fila-sep">
                                <div class="doc-bloque">
                                    <template lwc:if={v.conCliente}>
                                        <div class="doc-gris">Cliente</div>
                                        <span class="doc-marca doc-fuerte" style={v.fijo.verde}>{v.clienteNombre}</span>
                                        <div>NIF <span class="doc-marca" style={v.fijo.verde}>{v.clienteCif}</span></div>
                                    </template>
                                    <template lwc:if={v.x.sumin}>
                                        <div class="doc-gris">Dirección de suministro</div>
                                        <span class="doc-marca" style={v.fijo.verde}>{v.x.sumin}</span>
                                    </template>
                                </div>
                                <div class="doc-bloque doc-bloque-der">
                                    <div class="doc-gris">Fecha</div>
                                    <span class="doc-marca doc-fuerte" style={v.hl.fecha}>{v.x.fecha}</span>
                                </div>
                            </div>
                            <div class="doc-lineas">
                                <div class="doc-linea doc-gris"><span class="doc-flex">Concepto</span><span>Importe</span></div>
                                <template for:each={v.x.lineas} for:item="l">
                                    <div key={l.key} class="doc-linea">
                                        <span class="doc-flex"><span class="doc-marca" style={l.estilo}>{l.c}</span></span>
                                        <span class="doc-marca" style={l.estilo}>{l.i}</span>
                                    </div>
                                </template>
                            </div>
                            <div class="doc-totales">
                                <template for:each={v.ivaPreview} for:item="p">
                                    <div key={p.key} class="doc-totales-bloque">
                                        <div class="doc-linea"><span class="doc-flex">Base imponible <span class="doc-marca" style={p.estilo}>{p.pct} %</span></span><span class="doc-marca" style={p.estilo}>{p.base} €</span></div>
                                        <div class="doc-linea"><span class="doc-flex">IVA <span class="doc-marca" style={p.estilo}>{p.pct} %</span></span><span class="doc-marca" style={p.estilo}>{p.cuota} €</span></div>
                                    </div>
                                </template>
                                <div class="doc-linea doc-total"><span class="doc-flex">TOTAL</span><span class="doc-marca" style={v.hl.total}>{v.x.total} €</span></div>
                            </div>
                        </div>
                    </c-bandeja-contable-visor>
                </section>

                <div class="doc-derecha">
                    <template lwc:if={v.rosetta}>
                        <!-- ===== Rosetta IA: el chat ocupa el sitio de las capas y las pestañas ===== -->
                        <section class="bc-card doc-rosetta">
                            <button class="bc-boton-sec bc-boton-peq" onclick={volverDeRosetta}>‹ Volver</button>
                            <span class="doc-rosetta-icono"><lightning-icon icon-name="utility:chat" size="x-small" variant="inverse"></lightning-icon></span>
                            <span class="doc-rosetta-textos"><span class="doc-rosetta-titulo">Rosetta IA</span><span class="doc-gris-peq">Chat sobre esta factura · histórico de conversaciones</span></span>
                        </section>
                    </template>
                    <template lwc:else>
                        <!-- ===== Capas del documento ===== -->
                        <section class="bc-card doc-capas-card">
                            <div class="doc-capas">
                                <template for:each={v.capasLista} for:item="c">
                                    <button key={c.k} class={c.clase} data-k={c.k} title={c.tip} onclick={elegirCapa}>
                                        <span class="doc-capa-fila">
                                            <span class="doc-capa-n"><template lwc:if={c.on}>✓</template></span>
                                            <span class="doc-capa-titulo">{c.titulo}</span>
                                            <span class={c.claseBadge}>{c.badge}</span>
                                        </span>
                                        <span class="doc-capa-sub">{c.sub}</span>
                                    </button>
                                </template>
                            </div>
                        </section>

                        <!-- ===== Pestañas ===== -->
                        <section class="bc-card doc-pestanas-card">
                            <div class="doc-pestanas">
                                <template for:each={v.pestanas} for:item="t">
                                    <button key={t.k} class={t.clase} data-k={t.k} onclick={elegirPestana}>{t.label}
                                        <template lwc:if={t.conAviso}><span class="doc-pestana-aviso" title="Comprobaciones con incidencias">⚠ {t.n}</span></template>
                                        <template lwc:if={t.conN}><span class={t.claseN}>{t.n}</span></template>
                                    </button>
                                </template>
                            </div>
                        </section>
                    </template>

                    <!-- ===== Lectura preliminar (real, del procesamiento en Google) ===== -->
                    <template lwc:if={v.googleVisible}>
                        <section class="bc-card doc-google">
                            <div class="doc-google-cab">
                                <span class="doc-google-titulo">Lectura preliminar</span>
                                <span class={v.google.claseEstado}>{v.google.estadoTxt}</span>
                                <template lwc:if={v.google.motivosTxt}><span class="doc-google-motivo">{v.google.motivosTxt}</span></template>
                                <span class="doc-flex"></span>
                                <span class="doc-gris-peq">Preliminar: sirve para separar y reconocer el documento</span>
                            </div>
                            <div class="doc-google-campos">
                                <template for:each={v.google.campos} for:item="c">
                                    <div key={c.label} class="doc-google-campo"><span class="doc-meta-label">{c.label}</span><span class="doc-meta-valor">{c.valor}</span></div>
                                </template>
                            </div>
                            <template lwc:if={v.google.dudas}><div class="doc-google-dudas">Dudas del modelo: {v.google.dudas}</div></template>
                            <template lwc:if={v.google.conExtraccion}>
                                <div class="doc-google-nota">Los datos de la pestaña Datos (partes, fechas, desglose de IVA, totales y productos) los ha <b>leído la IA</b> ({v.google.motor}). Siguen siendo <b>de ejemplo</b>: cuentas contables, reglas, skills y las comprobaciones que dependen de fuentes externas.</div>
                            </template>
                            <template lwc:else>
                                <div class="doc-google-nota">Este documento no tiene datos extraídos: los datos contables de las pestañas son <b>de ejemplo</b>.</div>
                            </template>
                        </section>
                    </template>

                    <!-- ===== Datos ===== -->
                    <template lwc:if={v.enDatos}>
                        <div class="doc-datos-grid">
                            <fieldset class="doc-fieldset doc-ancho" disabled={v.bloqueado}>
                                <section class="bc-card doc-seccion-card">
                                    <template lwc:if={v.bloqueado}>
                                        <div class="doc-bloqueo">
                                            <lightning-icon icon-name="utility:lock" size="xx-small" class="doc-icono-rojo"></lightning-icon>
                                            <span>Factura bloqueada: no contabilizada · {v.doc.motivo}. Reabre la factura para editar los datos.</span>
                                        </div>
                                    </template>
                                    <div class="doc-seccion-pad">
                                        <template lwc:if={v.divisa.hay}>
                                            <div class="doc-divisa">
                                                <span class="doc-divisa-eur">{v.divisa.eur} €</span>
                                                <span class="doc-divisa-fx" title="Importe convertido">fx</span>
                                                <span class="doc-gris-13">Tipo de cambio aplicado: 1 {v.divisa.simb} =
                                                    <template lwc:if={v.divisa.editando}><input class="doc-divisa-input" value={v.divisa.rate} onchange={handleDivisa}></template>
                                                    <template lwc:else><span class="bc-num">{v.divisa.rate}</span></template>
                                                    €, a {v.divisa.fecha}
                                                </span>
                                                <button class="doc-enlace-boton" onclick={toggleDivisa}>{v.divisa.boton}</button>
                                                <span class="doc-divisa-orig">Importe original: <b class="bc-num">{v.divisa.orig} {v.divisa.simb}</b> ({v.divisa.moneda})</span>
                                            </div>
                                        </template>
                                        <div class="doc-seccion-cab">
                                            <span class="doc-seccion-titulo doc-flex">Desglose de IVA</span>
                                            <span class="bc-card-nota">{v.ivaTipos}</span>
                                            <button class="bc-boton-linea doc-sin-margen" onclick={anadirIva}>+ Añadir línea tipo de IVA</button>
                                        </div>
                                        <div class="doc-tabla doc-tabla-iva">
                                            <div class="doc-iva-fila doc-tabla-cab">
                                                <span title="Cuenta de gasto (recibidas) o de ingreso (emitidas)">Contrapartida</span><span>Base (€)</span><span>Tipo IVA</span><span>Cuota IVA</span>
                                                <span title="Porcentaje del IVA que se puede deducir">% Ded.</span><span>Cuota R.E.</span><span>Tipo ret.</span><span>Cuota ret.</span><span title="Código de transacción">T.T.</span><span></span>
                                            </div>
                                            <template for:each={v.filasIva} for:item="r">
                                                <div key={r.key}>
                                                    <div class={r.claseFila} data-k={r.hk} onmouseenter={entrar} onmouseleave={salir}>
                                                        <input class={r.claseContra} value={r.contra} data-i={r.i} data-tipo="iva" readonly title="Pulsa para buscar la cuenta" onclick={abrirCuentas}>
                                                        <input class="doc-iva-input" value={r.base} data-i={r.i} data-k="base" onchange={handleIva}>
                                                        <select class="doc-iva-input doc-iva-izq" data-i={r.i} data-k="pct" onchange={handleIva}>
                                                            <template for:each={r.opcionesPct} for:item="o"><option key={o.v} value={o.v} selected={o.selected}>{o.l}</option></template>
                                                        </select>
                                                        <input class={r.claseCuota} value={r.cuota} data-i={r.i} data-k="cuota" onchange={handleIva}>
                                                        <div class="doc-ded-celda">
                                                            <button class={r.claseDed} title={r.dedTip} data-i={r.i} onclick={toggleDeducible}>{r.dedL}</button>
                                                            <template lwc:if={r.abierto}>
                                                                <div class="doc-popover doc-popover-ded">
                                                                    <div class="doc-popover-fila">
                                                                        <span class="doc-flex doc-popover-titulo-peq">IVA deducible</span>
                                                                        <button class="doc-x" aria-label="Cerrar" data-i={r.i} onclick={toggleDeducible}>×</button>
                                                                    </div>
                                                                    <template lwc:if={r.sugerencia}>
                                                                        <button class="doc-ded-sugerencia" data-i={r.i} onclick={sugerirDeducible}><span class="doc-sugerido doc-sugerido-fuerte">Sugerido por la IA</span>{r.sugerencia}</button>
                                                                    </template>
                                                                    <div class="doc-ded-rapidos">
                                                                        <template for:each={r.rapidos} for:item="q">
                                                                            <button key={q.v} class={q.clase} data-i={r.i} data-v={q.v} onclick={rapidoDeducible}>{q.v} %</button>
                                                                        </template>
                                                                    </div>
                                                                    <label class="doc-ded-otro">Otro %
                                                                        <input class="doc-ded-input" value={r.ded} data-i={r.i} data-k="ded" onchange={handleDeducible}>
                                                                    </label>
                                                                    <label class="doc-ded-otro doc-ded-col">
                                                                        <span>Motivo <template lwc:if={r.parcial}><b class="bc-rojo">*</b></template><template lwc:else><span class="doc-gris">(opcional)</span></template></span>
                                                                        <textarea class={r.claseMot} rows="2" placeholder="Ej.: vivienda afecta al 30 % según contrato" value={r.dedMot} data-i={r.i} data-k="dedMot" onchange={handleDeducible}></textarea>
                                                                        <template lwc:if={r.errMot}><span class="doc-error">El motivo es obligatorio si no deduces el 100 %.</span></template>
                                                                    </label>
                                                                    <div class="doc-ded-pie">Deducible <b class="doc-verde">{r.cDed} €</b> · No deducible <b class="bc-rojo">{r.cNoDed} €</b></div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                        <input class="doc-iva-input" value={r.re} data-i={r.i} data-k="re" onchange={handleIva}>
                                                        <select class="doc-iva-input doc-iva-izq" data-i={r.i} data-k="retPct" onchange={handleIva}>
                                                            <template for:each={r.opcionesRet} for:item="o"><option key={o.v} value={o.v} selected={o.selected}>{o.l}</option></template>
                                                        </select>
                                                        <input class={r.claseRet} value={r.ret} data-i={r.i} data-k="ret" onchange={handleIva}>
                                                        <select class="doc-iva-input doc-iva-izq" data-i={r.i} data-k="tt" onchange={handleIva}>
                                                            <template for:each={r.opcionesTt} for:item="o"><option key={o.v} value={o.v} selected={o.selected}>{o.l}</option></template>
                                                        </select>
                                                        <button class="bc-boton-quitar doc-quitar" title="Quitar línea" data-i={r.i} onclick={quitarIva}>×</button>
                                                    </div>
                                                    <template lwc:if={r.parcial}>
                                                        <div class={r.claseSub}>
                                                            <span class="doc-ded-aviso">IVA deducible al {r.dedL}</span>
                                                            <span>Deducible <b class="doc-verde">{r.cDed} €</b></span>
                                                            <span>No deducible <b class="bc-rojo">{r.cNoDed} €</b> → mayor gasto</span>
                                                            <span>{r.dedMotL}</span>
                                                        </div>
                                                    </template>
                                                    <template lwc:if={r.hayChips}>
                                                        <div class={r.claseSub}>
                                                            <span class="doc-skill-etiqueta">Skill:</span>
                                                            <template for:each={r.chips} for:item="k">
                                                                <button key={k.key} class="doc-chip-skill" title={k.tip} data-num={k.num} onclick={abrirChip}>{k.label}</button>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <div class="doc-iva-fila doc-tabla-pie">
                                                <span></span><span class="bc-derecha">{v.sumas.base}</span><span class="bc-card-nota">Total</span><span class="bc-derecha">{v.sumas.cuota}</span>
                                                <span></span><span class="bc-derecha">{v.sumas.re}</span><span></span><span class="bc-derecha">{v.sumas.ret}</span><span></span><span></span>
                                            </div>
                                            <template lwc:if={v.sumas.hayNoDed}>
                                                <div class="doc-iva-noded">
                                                    <span>IVA deducible <b>{v.sumas.ded} €</b></span>
                                                    <span>IVA no deducible <b>{v.sumas.noDed} €</b> (se suma al gasto)</span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </section>
                            </fieldset>

                            <fieldset class="doc-fieldset" disabled={v.bloqueado}>
                                <section class="bc-card doc-seccion-card doc-seccion-campos">
                                    <template lwc:if={v.alerta}><div class={v.alerta.clase}>{v.alerta.texto}</div></template>
                                    <template for:each={v.gruposCabecera} for:item="g">
                                        <div key={g.titulo} class="doc-seccion">
                                            <div class="doc-seccion-titulo">{g.titulo}</div>
                                            <div class={g.clase}>
                                                <template for:each={g.campos} for:item="f">
                                                    <label key={f.k} class="doc-campo" data-k={f.k} onmouseenter={entrar} onmouseleave={salir}>
                                                        <span class="doc-campo-label">{f.label}</span>
                                                        <input class={f.clase} value={f.valor} data-k={f.k} data-tipo="prov" readonly={f.soloLectura} placeholder={f.placeholder} title={f.titulo} onchange={handleCampo} onclick={clickCampo}>
                                                    </label>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Conceptos (líneas de la factura): solo si la factura los trae -->
                                    <template lwc:if={v.conceptos.hay}>
                                        <div class="doc-seccion">
                                            <div class="doc-seccion-cab">
                                                <span class="doc-seccion-titulo doc-flex">Conceptos</span>
                                                <span class="bc-card-nota">{v.conceptos.resumen}</span>
                                            </div>
                                            <div class="doc-tabla doc-tabla-peq">
                                                <div class="doc-concepto-fila doc-tabla-cab">
                                                    <span>Descripción</span><span class="bc-derecha">Cant.</span><span class="bc-derecha">Precio (€)</span>
                                                    <span class="bc-derecha">IVA %</span><span class="bc-derecha">Importe (€)</span><span></span>
                                                </div>
                                                <template for:each={v.conceptos.filas} for:item="c">
                                                    <div key={c.key} class={c.clase} data-i={c.i} onmouseenter={entrarConcepto} onmouseleave={salirConcepto}>
                                                        <input class="doc-iva-input doc-iva-izq" value={c.descripcion} title={c.descripcion} data-i={c.i} data-k="descripcion" onchange={handleConcepto}>
                                                        <input class="doc-iva-input" value={c.cantidad} data-i={c.i} data-k="cantidad" onchange={handleConcepto}>
                                                        <input class="doc-iva-input" value={c.precio} data-i={c.i} data-k="precio_unitario" onchange={handleConcepto}>
                                                        <input class="doc-iva-input" value={c.tipoIva} data-i={c.i} data-k="tipo_iva" onchange={handleConcepto}>
                                                        <input class={c.claseImporte} value={c.importe} data-i={c.i} data-k="importe" onchange={handleConcepto}>
                                                        <button class="bc-boton-quitar doc-quitar" title="Quitar concepto" data-i={c.i} onclick={quitarConcepto}>×</button>
                                                    </div>
                                                </template>
                                                <div class="doc-concepto-fila doc-tabla-pie">
                                                    <span class="bc-card-nota">Suma de conceptos</span><span></span><span></span><span></span>
                                                    <span class="bc-derecha">{v.conceptos.suma}</span><span></span>
                                                </div>
                                            </div>
                                            <button class="bc-boton-linea" onclick={anadirConcepto}>+ Añadir concepto</button>
                                            <div class={v.conceptos.claseCuadre}>{v.conceptos.cuadre}</div>
                                        </div>
                                    </template>

                                    <template for:each={v.gruposTotales} for:item="g">
                                        <div key={g.titulo} class="doc-seccion">
                                            <div class="doc-seccion-titulo">{g.titulo}</div>
                                            <div class={g.clase}>
                                                <template for:each={g.campos} for:item="f">
                                                    <label key={f.k} class="doc-campo" data-k={f.k} onmouseenter={entrar} onmouseleave={salir}>
                                                        <span class="doc-campo-label">{f.label}</span>
                                                        <input class={f.clase} value={f.valor} data-k={f.k} data-tipo="prov" readonly={f.soloLectura} placeholder={f.placeholder} title={f.titulo} onchange={handleCampo} onclick={clickCampo}>
                                                    </label>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <template lwc:if={v.aprendizaje.preguntar}>
                                        <div class="doc-aviso doc-aviso-info doc-aprender">
                                            <span class="doc-flex">Has cambiado la cuenta a <b>{v.aprendizaje.cuenta}</b> para <b>{v.aprendizaje.proveedor}</b>. ¿Aplicar siempre para este proveedor?</span>
                                            <button class="bc-boton-sec bc-boton-mini" onclick={soloEstaVez}>Solo esta vez</button>
                                            <button class="bc-boton bc-boton-mini" onclick={aplicarSiempre}>Aplicar siempre</button>
                                        </div>
                                    </template>
                                    <template lwc:if={v.aprendizaje.hecho}>
                                        <div class="doc-aviso doc-aviso-ok">
                                            <b>Regla guardada</b><span class="doc-flex">Las próximas facturas de este proveedor irán a esta cuenta.</span>
                                            <a class="bc-enlace" href="#" onclick={verEmpresa}>Ver regla</a>
                                        </div>
                                    </template>
                                    <div class="doc-espacio"></div>
                                </section>
                            </fieldset>

                            <fieldset class="doc-fieldset" disabled={v.bloqueado}>
                                <section class="bc-card doc-seccion-card doc-seccion-asiento">
                                    <div class="doc-seccion">
                                        <div class="doc-seccion-cab"><span class="doc-seccion-titulo doc-flex">Propuesta de asiento contable</span><span class={v.asiento.claseBadge}>{v.asiento.badge}</span></div>
                                        <div class="doc-tabla doc-tabla-peq">
                                            <div class="doc-asiento-fila doc-tabla-cab"><span>Cuenta</span><span>Concepto</span><span class="bc-derecha">Debe (€)</span><span class="bc-derecha">Haber (€)</span><span></span></div>
                                            <template for:each={v.asiento.filas} for:item="a">
                                                <div key={a.key} class="doc-asiento-fila bc-num">
                                                    <input class={a.claseCuenta} value={a.cuenta} data-i={a.i} data-tipo="asiento" readonly title="Pulsa para buscar la cuenta" onclick={abrirCuentas}>
                                                    <input class={a.claseConcepto} value={a.concepto} title={a.concepto} data-i={a.i} data-k="concepto" onchange={handleAsiento}>
                                                    <input class={a.claseDebe} value={a.debe} data-i={a.i} data-k="debe" onchange={handleAsiento}>
                                                    <input class={a.claseHaber} value={a.haber} data-i={a.i} data-k="haber" onchange={handleAsiento}>
                                                    <span></span>
                                                </div>
                                            </template>
                                            <template for:each={v.asiento.extra} for:item="x">
                                                <div key={x.key} class="doc-asiento-fila doc-asiento-extra">
                                                    <input class="doc-input doc-input-peq doc-input-cuenta" placeholder="Cuenta" value={x.cuenta} data-i={x.i} data-tipo="extra" readonly title="Pulsa para buscar la cuenta" onclick={abrirCuentas}>
                                                    <input class="doc-input doc-input-peq" placeholder="Concepto" value={x.concepto} data-i={x.i} data-k="concepto" onchange={handleLineaExtra}>
                                                    <input class="doc-input doc-input-peq doc-input-num" placeholder="0,00" value={x.debe} data-i={x.i} data-k="debe" onchange={handleLineaExtra}>
                                                    <input class="doc-input doc-input-peq doc-input-num" placeholder="0,00" value={x.haber} data-i={x.i} data-k="haber" onchange={handleLineaExtra}>
                                                    <button class="bc-boton-quitar" title="Quitar línea" data-i={x.i} onclick={quitarLinea}>×</button>
                                                </div>
                                            </template>
                                            <div class="doc-asiento-fila doc-tabla-pie bc-num"><span></span><span class="bc-card-nota">Sumas</span><span class="bc-derecha">{v.asiento.debe}</span><span class="bc-derecha">{v.asiento.haber}</span><span></span></div>
                                        </div>
                                        <button class="bc-boton-linea" onclick={anadirLinea}>+ Añadir línea</button>
                                        <div class="doc-nota">Fecha del asiento {v.asiento.fecha} · {v.asiento.diario} · Se genera al validar</div>
                                    </div>
                                    <div class={v.cuadre.clase}><b>{v.cuadre.titulo}</b><span>{v.cuadre.texto}</span></div>
                                    <div class="doc-espacio"></div>
                                </section>
                            </fieldset>

                        </div>
                    </template>

                    <!-- ===== Otras pestañas ===== -->
                    <template lwc:if={v.enChk}>
                        <c-bandeja-contable-doc-comprobaciones items={v.checks} filtro-inicial={v.filtroChk}></c-bandeja-contable-doc-comprobaciones>
                    </template>
                    <template lwc:if={v.enCliente}>
                        <c-bandeja-contable-doc-cliente vista={pestana} cliente={cliente} error={errorCliente}
                                                        perfil-sin-datos={v.perfilSinDatos} turismos={v.turismos}></c-bandeja-contable-doc-cliente>
                    </template>
                    <template lwc:if={v.enAnalisis}>
                        <c-bandeja-contable-doc-analisis vista={pestana} analisis={v.is} productos={v.productos} financiero={v.financiero}
                                                         resaltado={productoResaltado} onresaltar={resaltarProducto}></c-bandeja-contable-doc-analisis>
                    </template>
                    <template lwc:if={v.enColaboracion}>
                        <c-bandeja-contable-doc-colaboracion vista={pestana} doc-id={v.doc.id} contexto={v.contexto}
                                                             oncambio={alCambiarColaboracion}></c-bandeja-contable-doc-colaboracion>
                    </template>
                    <template lwc:if={v.enSkills}>
                        <section class="bc-card doc-seccion-card doc-seccion-pad">
                            <c-bandeja-contable-skills empresa-id={v.doc.empresaId} empresa-nombre={v.contexto.empresa} nif={v.contexto.nif} abrir={skillAbrir}
                                                       modo="pestana" oncambio={alCambiarSkills}></c-bandeja-contable-skills>
                        </section>
                    </template>
                </div>
            </div>

            <!-- ===== Buscador de cuentas contables ===== -->
            <template lwc:if={v.cuentas}>
                <c-bandeja-contable-cuentas valor={v.cuentas.valor} grupo={v.cuentas.grupo} solo-codigo={v.cuentas.soloCodigo} ancla={v.cuentas.ancla}
                                            onelegir={elegirCuenta} oncerrar={cerrarCuentas}></c-bandeja-contable-cuentas>
            </template>

            <!-- ===== Validar con riesgo ===== -->
            <template lwc:if={v.avisoValidar}>
                <div class="doc-fondo">
                    <div class="doc-modal doc-modal-aviso" role="dialog" aria-modal="true" aria-label="Validar con riesgo fiscal">
                        <div class="doc-modal-cab-rojo">
                            <span class="doc-modal-icono">!</span>
                            <div class="doc-modal-titulos">
                                <span class="doc-modal-titulo-rojo">Vas a validar con riesgo fiscal</span>
                                <span class="doc-gris-13">Esta factura tiene {v.avisoValidar.n} riesgo(s) fiscal(es). Elige cómo se resuelve antes de validar. Quedará registrado en Notas y archivos.</span>
                            </div>
                        </div>
                        <div class="doc-modal-cuerpo">
                            <div class="doc-modal-lista">
                                <template for:each={v.avisoValidar.riesgos} for:item="w">
                                    <div key={w.clave} class="doc-modal-linea"><span class="bc-pill bc-pill-peq bc-pill-error">{w.tag}</span><span class="doc-fuerte">{w.titulo}</span></div>
                                </template>
                            </div>
                            <div class="doc-resoluciones">
                                <span class="doc-eyebrow">¿Cómo se resuelve?</span>
                                <template for:each={v.avisoValidar.opciones} for:item="o">
                                    <button key={o.k} class={o.clase} data-opt={o.k} onclick={elegirResolucion}>
                                        <span class="doc-resolucion-radio"></span>
                                        <span class="doc-resolucion-textos"><span class="doc-fuerte">{o.label}</span><span class="doc-gris-peq">{o.sub}</span></span>
                                    </button>
                                </template>
                                <template lwc:if={v.avisoValidar.esSkill}>
                                    <div class="doc-resolucion-form">
                                        <label class="doc-resolucion-campo">Título de la skill
                                            <input class="doc-input" value={v.avisoValidar.skTitle} data-k="skTitle" oninput={handleResolucion}></label>
                                        <label class="doc-resolucion-campo">Instrucción para la IA
                                            <textarea class="doc-textarea" rows="3" value={v.avisoValidar.skText} data-k="skText" oninput={handleResolucion}></textarea></label>
                                        <span class="doc-gris-peq">Se aplicará a las próximas facturas de {v.avisoValidar.emisor} de este cliente. Datos de ejemplo: la skill se guarda solo en esta sesión.</span>
                                    </div>
                                </template>
                                <template lwc:if={v.avisoValidar.esCliente}>
                                    <div class="doc-resolucion-form doc-resolucion-cliente">
                                        <span class="doc-resolucion-aviso">
                                            <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                                            Al validar se enviará este email al cliente para que acepte el riesgo. Revísalo antes.
                                            <span class="bc-ejemplo" title="El envío de correos todavía no existe: el correo queda anotado en la pestaña Correos">Datos de ejemplo</span>
                                        </span>
                                        <label class="doc-resolucion-campo">Para
                                            <input class="doc-input" type="email" placeholder="Email del cliente" value={v.avisoValidar.to} data-k="to" oninput={handleResolucion}></label>
                                        <label class="doc-resolucion-campo">Asunto
                                            <input class="doc-input" value={v.avisoValidar.subject} data-k="subject" oninput={handleResolucion}></label>
                                        <label class="doc-resolucion-campo">Mensaje
                                            <textarea class="doc-textarea" rows="5" value={v.avisoValidar.body} data-k="body" oninput={handleResolucion}></textarea></label>
                                    </div>
                                </template>
                                <template lwc:if={v.avisoValidar.esOtros}>
                                    <label class="doc-resolucion-campo"><span>Motivo <b class="bc-rojo">*</b></span>
                                        <textarea class="doc-textarea" rows="3" placeholder="Explica por qué se valida pese al riesgo…" value={v.avisoValidar.motivo} data-k="motivo" oninput={handleResolucion}></textarea></label>
                                </template>
                            </div>
                        </div>
                        <div class="doc-modal-pie">
                            <button class="bc-boton-sec bc-boton-peq" onclick={cancelarValidar}>Revisar</button>
                            <button class={v.avisoValidar.claseBoton} disabled={v.avisoValidar.noListo} onclick={aceptarRiesgo}>{v.avisoValidar.boton}</button>
                        </div>
                    </div>
                </div>
            </template>
        </template>
    </main>
</template>
