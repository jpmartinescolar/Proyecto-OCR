<template>
    <div class="pyg-container">

        <!-- SUBMENÚS con la marca del componente a la derecha -->
        <div class="ts-tabs acf-menubar">
            <div class="lm-subtabs">
                <button class={claseMenuOperativa} data-menu="operativa" onclick={handleMenu}>Inicio</button>
                <button class={claseMenuBalances} data-menu="balances" onclick={handleMenu}>Área Contable y Fiscal</button>
                <!-- Área Marketing: pestaña nueva, de momento en construcción, visible para todos -->
                <button class={claseMenuMarketing} data-menu="marketing" onclick={handleMenu}>Área Marketing</button>
                <template if:true={rhAcceso}>
                    <button class={claseMenuRrhh} data-menu="rrhh" onclick={handleMenu}>Área RR.HH</button>
                </template>
                <button class={claseMenuImputaciones} data-menu="imputaciones" onclick={handleMenu}>Análisis Imputaciones</button>
                <!-- Onboarding y Offboarding: pestañas de RR.HH todavía sin contenido, mismo acceso que el Área RR.HH -->
                <template if:true={rhAcceso}>
                    <button class={claseMenuOnboarding} data-menu="onboarding" onclick={handleMenu}>Onboarding</button>
                    <button class={claseMenuOffboarding} data-menu="offboarding" onclick={handleMenu}>Offboarding</button>
                </template>
                <div class="acf-brand">
                    <button class="acf-btn-operativa" onclick={handleAccesoOperativa}
                            title="Ir al ERP Contable y Fiscal">ERP Contable y Fiscal</button>
                    <button class="acf-btn-ausencia" onclick={handleSolicitarAusencia}
                            title="Solicitar una ausencia o vacaciones">Solicitar Ausencia o Vacaciones</button>
                </div>
            </div>
        </div>

        <!-- PESTAÑAS DE MI PANEL -->
        <template if:true={esOperativa}>
            <div class="ts-tabs acf-optabs acf-optabs-inicio">
                <div class="lm-subtabs">
                    <template for:each={opTabs} for:item="t">
                        <button key={t.key} class={t.cls} data-tab={t.key} onclick={handleOpTab}>{t.label}<template if:true={t.aviso}><lightning-icon icon-name="utility:warning" size="xx-small" class="lm-subtab-aviso" alternative-text="Con pendientes"></lightning-icon></template></button>
                    </template>
                </div>
            </div>
        </template>

        <!-- PESTAÑAS DE ÁREA CONTABLE Y FISCAL -->
        <template if:true={esBalances}>
            <div class="ts-tabs acf-optabs acf-optabs-bal">
                <div class="lm-subtabs">
                    <template for:each={balTabs} for:item="t">
                        <button key={t.key} class={t.cls} data-tab={t.key} onclick={handleBalTab}>{t.label}<template if:true={t.aviso}><lightning-icon icon-name="utility:warning" size="xx-small" class="lm-subtab-aviso" alternative-text="Con incidencias"></lightning-icon></template></button>
                    </template>
                </div>
            </div>
        </template>

        <!-- PESTAÑAS DEL ERP CONTABLE Y FISCAL: solo los informes -->
        <template if:true={esBalOperativa}>
            <div class="ts-tabs acf-optabs acf-optabs-inicio">
                <div class="lm-subtabs">
                    <template for:each={opeTabs} for:item="t">
                        <button key={t.key} class={t.cls} data-tab={t.key} onclick={handleOpeTab}>{t.label}</button>
                    </template>
                </div>
            </div>
        </template>

        <!-- LOADING -->
        <template if:true={loading}>
            <div class="pyg-loading"><lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner></div>
        </template>

        <!-- ERROR -->
        <template if:true={hasError}>
            <div class="pyg-error">
                <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                <span>{error}</span>
            </div>
        </template>

        <template if:true={esVisionGeneral}>
        <template if:true={showContent}>
            <div class="acf-wrap">

                <!-- TOTALES DE LA VISIÓN GENERAL EN HORIZONTAL -->
                <div class="vis-kpis">
                    <template for:each={visKpis} for:item="k">
                        <div key={k.key} class={k.cls} data-destino={k.destino}
                             onclick={handleVisKpi} title={k.label}>
                            <div class="acf-kpi-num">{k.n}</div>
                            <div class="acf-kpi-label">{k.label}</div>
                            <template if:true={k.venc}>
                                <div class="vis-kpi-venc">{k.venc}</div>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="acf-card">

                    <!-- FILTROS -->
                    <div class="acf-filtros">
                        <!-- Empresa titular: multiselección -->
                        <div class="acf-filtro ts-ms-wrap">
                            <label class="slds-form-element__label">Empresa titular</label>
                            <button class="ts-ms-trigger" type="button" onclick={toggleEmpresaDropdown}>
                                <span class="ts-ms-trigger-text">{empresaTriggerLabel}</span>
                                <span class="ts-ms-caret">▾</span>
                            </button>
                            <template if:true={showEmpresaDropdown}>
                                <div class="ts-ms-backdrop" onclick={closeEmpresaDropdown}></div>
                                <div class="ts-ms-panel" onclick={stopClick}>
                                    <div class="ts-ms-actions">
                                        <button type="button" class="ts-ms-link" onclick={handleEmpresaTodas}>Todas</button>
                                    </div>
                                    <div class="ts-ms-list">
                                        <template for:each={empresaOptionsView} for:item="opt">
                                            <div key={opt.value} class={opt.optionClass}
                                                 data-value={opt.value} onclick={handleEmpresaToggle}>
                                                <span class="ts-ms-check"></span>
                                                <span class="ts-ms-label">{opt.label}</span>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="ts-ms-foot">
                                        <button type="button" class="slds-button slds-button_brand ts-ms-apply"
                                                onclick={closeEmpresaDropdown}>Aplicar</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <!-- Departamento asignado: multiselección -->
                        <div class="acf-filtro ts-ms-wrap">
                            <label class="slds-form-element__label">Departamento asignado</label>
                            <button class="ts-ms-trigger" type="button" onclick={toggleDeptoDropdown}>
                                <span class="ts-ms-trigger-text">{deptoTriggerLabel}</span>
                                <span class="ts-ms-caret">▾</span>
                            </button>
                            <template if:true={showDeptoDropdown}>
                                <div class="ts-ms-backdrop" onclick={closeDeptoDropdown}></div>
                                <div class="ts-ms-panel" onclick={stopClick}>
                                    <div class="ts-ms-actions">
                                        <button type="button" class="ts-ms-link" onclick={handleDeptoTodos}>Todos</button>
                                    </div>
                                    <div class="ts-ms-list">
                                        <template for:each={deptoOptionsView} for:item="opt">
                                            <div key={opt.value} class={opt.optionClass}
                                                 data-value={opt.value} onclick={handleDeptoToggle}>
                                                <span class="ts-ms-check"></span>
                                                <span class="ts-ms-label">{opt.label}</span>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="ts-ms-foot">
                                        <button type="button" class="slds-button slds-button_brand ts-ms-apply"
                                                onclick={closeDeptoDropdown}>Aplicar</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <lightning-combobox label="Activo" value={filtroActivo}
                                            options={opcionesActivo} onchange={handleFiltroActivo}
                                            class="acf-filtro"></lightning-combobox>
                        <div class="acf-agrupar-wrap">
                            <button class={visMisBtnCls} onclick={handleVisMios}
                                    title="Ver solo mi línea de pendientes">Mis pendientes</button>
                        </div>
                        <div class="acf-agrupar-wrap">
                            <button class={visInactivosCls} onclick={handleVisInactivos}
                                    title="Ver solo a los usuarios inactivos con trabajos pendientes">{visInactivosLabel}</button>
                        </div>
                        <div class="acf-agrupar-wrap">
                            <button class="acf-btn-agrupar" onclick={handleVisLimpiar}
                                    title="Dejar los filtros y botones como al llegar a la pestaña">Limpiar</button>
                        </div>
                        <div class="acf-kpis-der-refresh">
                            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refrescar"
                                                   title="Refrescar" variant="border-filled" size="small"
                                                   onclick={handleRefresh}></lightning-button-icon>
                        </div>
                    </div>

                    <template if:true={hayFilas}>
                        <div class="acf-scroll">
                            <table class="acf-tabla">
                                <thead>
                                    <tr class="acf-suphead">
                                        <th colspan="3"></th>
                                        <th colspan="12" class="acf-band acf-band-trabajos">Trabajos pendientes</th>
                                    </tr>
                                    <tr class="acf-suphead">
                                        <th colspan="3"></th>
                                        <th colspan="7" class="acf-band">Servicio Contrato contable y Fiscal</th>
                                        <th colspan="2" class="acf-band acf-band-extra">Extraordinario</th>
                                        <th colspan="3" class="acf-band acf-band-interno">Interno</th>
                                    </tr>
                                    <tr>
                                        <th class="acf-th-izq acf-th-usuario">Empresa titular / Usuario</th>
                                        <th class="acf-th-izq">Departamento</th>
                                        <th class="acf-th-izq">Estado</th>
                                        <template for:each={visionCols} for:item="col">
                                            <th key={col.campo} class={col.cls} data-campo={col.campo}
                                                onclick={handleVisionCol}
                                                title="Mostrar solo los usuarios con valor en esta columna">{col.label}</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="acf-totalrow">
                                        <td class="acf-td-izq">TOTAL</td>
                                        <td class="acf-td-izq acf-total-usuarios">{totales.usuarios}</td>
                                        <td></td>
                                        <template for:each={totales.celdas} for:item="c">
                                            <td key={c.key} class={c.cls}>
                                                <template if:true={c.link}>
                                                    <a href="javascript:void(0);" class="acf-link"
                                                       data-tab={c.tab} data-usuario={c.usuario}
                                                       onclick={handleVisionNav}
                                                       title="Abrir la pestaña">{c.val}</a>
                                                </template>
                                                <template if:false={c.link}><span>{c.val}</span></template>
                                                <template if:true={c.venc}><span class="acf-col-venc">{c.venc}</span></template>
                                            </td>
                                        </template>
                                        <td class="acf-num acf-num-azul">{totales.tareas}</td>
                                    </tr>
                                    <template for:each={filasTabla} for:item="f">
                                        <tr key={f.key} class={f.clase}>
                                            <template if:true={f.esGrupo}>
                                                <td class="acf-td-izq" colspan="2">{f.etiqueta}</td>
                                                <td></td>
                                            </template>
                                            <template if:true={f.esUsuario}>
                                                <td class="acf-td-izq acf-td-usuario">
                                                    <a href="javascript:void(0);" class="acf-link"
                                                       data-recordid={f.usuarioId}
                                                       onclick={navigateToRecordNewTab}
                                                       title="Abrir el usuario en una pestaña nueva">{f.nombre}</a>
                                                </td>
                                                <td class="acf-td-izq">{f.departamento}</td>
                                                <td class="acf-td-izq"><span class={f.estadoCls}>{f.estadoLabel}</span></td>
                                            </template>
                                            <template for:each={f.celdas} for:item="c">
                                                <td key={c.key} class={c.cls}>
                                                    <template if:true={c.link}>
                                                        <a href="javascript:void(0);" class="acf-link"
                                                           data-tab={c.tab} data-usuario={c.usuario}
                                                           onclick={handleVisionNav}
                                                           title="Abrir la pestaña filtrada">{c.val}</a>
                                                    </template>
                                                    <template if:false={c.link}><span>{c.val}</span></template>
                                                    <template if:true={c.venc}><span class="acf-col-venc">{c.venc}</span></template>
                                                </td>
                                            </template>
                                            <td class="acf-num acf-num-azul">{f.tareas}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <div class="acf-nota">Recuento de registros abiertos asignados a cada usuario en Salesforce, agrupados por empresa titular y departamento asignado.</div>
                    </template>
                    <template if:false={hayFilas}>
                        <div class="pyg-empty">
                            <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                            <span>No hay registros en estado abierto con los filtros seleccionados.</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
        </template>

        <!-- MI SITUACIÓN -->
        <template if:true={esMiSituacion}>
            <template if:true={misHasError}>
                <div class="pyg-error">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                    <span>{misError}</span>
                </div>
            </template>
            <template if:true={misShow}>
                <div class="acf-wrap">

                    <!-- ACCESOS RÁPIDOS -->
                    <div class="acf-accesos">
                        <template for:each={misAccesos} for:item="a">
                            <div key={a.key} class={a.cls} data-url={a.url} onclick={handleAcceso} title={a.label}>
                                <template if:false={a.esTimer}>
                                    <span class={a.chipCls}>
                                        <lightning-icon icon-name={a.icono} size="x-small"></lightning-icon>
                                    </span>
                                    <span class="acf-acceso-label">{a.label}</span>
                                    <template if:true={a.badge}>
                                        <span class="acf-acceso-badge">{a.badge}</span>
                                    </template>
                                </template>
                                <template if:true={a.esTimer}>
                                    <c-registro-horario-mini></c-registro-horario-mini>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- ESQUELETO DE CARGA: zona gris difuminada con la ruleta encima -->
                    <template if:true={misLoading}>
                        <div class="acf-skel-zona">
                            <div class="acf-skel acf-skel-venc"></div>
                            <div class="acf-skel-cajas">
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                                <div class="acf-skel acf-skel-caja"></div>
                            </div>
                            <div class="acf-skel acf-skel-tareas"></div>
                            <div class="acf-skel-ruleta">
                                <lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner>
                            </div>
                        </div>
                    </template>
                    <template if:false={misLoading}>

                    <!-- VENCIMIENTOS LEGALES: SEMANA ACTUAL Y SIGUIENTE -->
                    <template if:true={hayVencCeldas}>
                        <div class="acf-card acf-venc-panel">
                            <div class="acf-venc-head">
                                <span class="acf-venc-title">Vencimientos legales de expedientes · Semana actual y siguiente</span>
                                <span class="acf-venc-badges">
                                    <template if:true={hayVencSinPresentar}>
                                        <span class="acf-venc-badge acf-venc-badge-naranja acf-venc-badge-click"
                                              onclick={handleVencSinPresentar}
                                              title="Ver los vencimientos sin presentar">{vencSinPresentarLabel}</span>
                                    </template>
                                    <span class="acf-venc-badge acf-venc-badge-azul acf-venc-badge-click"
                                          onclick={handleVencPorDelante}
                                          title="Ver los vencimientos por delante">{vencPorDelanteLabel}</span>
                                    <span class="acf-venc-badge acf-venc-badge-morado acf-venc-badge-click"
                                          onclick={handleVencSenalPorDelante}
                                          title="Ver los señalamientos legales por delante">{vencSenalLabel}</span>
                                </span>
                            </div>
                            <div class="acf-venc-grid">
                                <template for:each={vencCeldas} for:item="v">
                                    <div key={v.key} class={v.cls}>
                                        <div class="acf-venc-dia">
                                            <template if:true={v.esHoy}>
                                                <span class="acf-venc-hoy-pill">{v.etiqueta}</span>
                                            </template>
                                            <template if:false={v.esHoy}>
                                                <span>{v.etiqueta}</span>
                                                <template if:true={v.aviso}><span class="acf-venc-aviso">⚠</span></template>
                                            </template>
                                        </div>
                                        <div class={v.textoCls} data-fecha={v.key} onclick={handleVencDia} title={v.vencTitle}>
                                            <template if:true={v.num}><span class="acf-venc-num">{v.num}</span></template>
                                            <span>{v.resto}</span>
                                        </div>
                                        <template if:true={v.senal}>
                                            <div class="acf-venc-senal acf-venc-link" data-fecha={v.key}
                                                 onclick={handleVencSenalDia}
                                                 title="Ver los señalamientos de este día">
                                                <span class="acf-venc-num">{v.senalNum}</span>
                                                <span>{v.senalTexto}</span>
                                            </div>
                                        </template>
                                        <template if:false={v.senal}>
                                            <div class="acf-venc-senal-vacio">— señalamientos</div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- MIS TOTALES -->
                    <!-- Once cajas de la misma altura; la primera es Mis leads -->
                    <div class="acf-mis-grid">
                        <template for:each={misCajas} for:item="c">
                            <div key={c.key} class={c.cls} data-tab={c.tab} onclick={handleMisCaja}
                                 title="Abrir la pestaña filtrada por mis registros">
                                <div class="acf-mis-num">{c.n}</div>
                                <div class="acf-mis-titulo">{c.titulo}</div>
                                <template if:true={c.venc}><div class="acf-mis-venc">{c.venc}</div></template>
                            </div>
                        </template>
                    </div>

                    <!-- MIS TAREAS -->
                    <div class="acf-contab">
                        <!-- Columna izquierda: total + orígenes -->
                        <div class="acf-contab-izq">
                            <div class="acf-kpi acf-kpi-click" onclick={handleMisTotal}
                                 title="Mostrar todas mis tareas abiertas hasta hoy">
                                <div class="acf-kpi-num">{misKpiTotal}</div>
                                <div class="acf-kpi-label">Mis tareas vencidas o para hoy</div>
                            </div>
                            <div class="acf-card acf-user-list">
                                <template for:each={misOrigenes} for:item="o">
                                    <div key={o.key} class={o.cls} data-key={o.key} onclick={handleMisOrigen}>
                                        <span class="acf-user-nombre">{o.nombre}</span>
                                        <span class="acf-user-num">{o.n}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <!-- Columna derecha: buscador + listado -->
                        <div class="acf-contab-der">
                            <!-- Buscador con Nueva tarea y el refresco a su derecha -->
                            <div class="acf-kpis-der acf-fila-filtros">
                                <div class="acf-buscador acf-buscador-linea">
                                    <lightning-input type="search" variant="label-hidden"
                                                     placeholder="Buscar por asunto, empresa, origen o relacionado…"
                                                     value={misBusqueda} onchange={handleMisBusqueda}></lightning-input>
                                </div>
                                <lightning-button label="Nueva tarea" onclick={handleMisNuevaTarea}
                                                  title="Crear una tarea nueva"></lightning-button>
                                <button class={misProxBtnCls} onclick={handleMisProximas}
                                        title="Ver mis tareas abiertas con vencimiento posterior a hoy">Mis próximas tareas</button>
                                <!-- Mismo flujo que el botón Realizar telemarketing del objeto Tareas -->
                                <button class="acf-btn-ausencia acf-btn-telemk" onclick={handleTmkAbrir}
                                        title="Abrir el flujo Telemarketing. Llamadas, el mismo que el botón Realizar telemarketing de Tareas">Realizar telemarketing</button>
                                <div class="acf-kpis-der-refresh">
                                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refrescar"
                                                           title="Refrescar" variant="border-filled" size="small"
                                                           onclick={handleMisRefresh}></lightning-button-icon>
                                </div>
                            </div>
                            <div class="acf-card">
                                <template if:true={misHayFilas}>
                                    <div class="acf-scroll">
                                        <table class="acf-tabla">
                                            <thead>
                                                <tr>
                                                    <th class="acf-th-izq acf-th-idx">#</th>
                                                    <th class="acf-th-izq">Fecha Vto.</th>
                                                    <th class="acf-th-izq">Vto. legal</th>
                                                    <th class="acf-th-izq">Riesgo</th>
                                                    <th class="acf-th-izq">Origen</th>
                                                    <th class="acf-th-izq">Asunto</th>
                                                    <th class="acf-th-izq">Empresa</th>
                                                    <th class="acf-th-izq">Relacionado con</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={misRows} for:item="c">
                                                    <tr key={c.key} class="acf-row">
                                                        <td class="acf-td-idx">{c.idx}</td>
                                                        <td class={c.fechaCls}>{c.fechaFmt}</td>
                                                        <td class="acf-td-izq">{c.vtoLegalFmt}</td>
                                                        <td class="acf-td-cen"><span class={c.riesgoCls}></span></td>
                                                        <td class="acf-td-izq acf-td-corta" title={c.origen}>{c.origen}</td>
                                                        <td class="acf-td-izq acf-td-titulo">
                                                            <a href="javascript:void(0);" class="acf-link"
                                                               data-recordid={c.id} data-object="Task"
                                                               onclick={navigateToRecordNewTab}
                                                               title={c.asunto}>{c.asunto}</a>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-empresa">
                                                            <template if:true={c.empresaId}>
                                                                <a href="javascript:void(0);" class="acf-link"
                                                                   data-recordid={c.empresaId} data-object="Account"
                                                                   onclick={navigateToRecordNewTab}
                                                                   title={c.empresa}>{c.empresa}</a>
                                                            </template>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-corta">
                                                            <template if:true={c.relId}>
                                                                <a href="javascript:void(0);" class="acf-link"
                                                                   data-recordid={c.relId} data-object={c.relTipo}
                                                                   onclick={navigateToRecordNewTab}
                                                                   title={c.relNombre}>{c.relNombre}</a>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <template if:true={misHayMas}>
                                        <div class="acf-mis-vertodas">
                                            <button class="acf-btn-vertodas" onclick={handleMisVerTodas}
                                                    title="Cargar el listado completo de mis tareas">{misVerTodasLabel}</button>
                                        </div>
                                    </template>
                                </template>
