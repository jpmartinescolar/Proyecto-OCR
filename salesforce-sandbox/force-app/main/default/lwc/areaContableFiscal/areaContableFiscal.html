                                    <button class={opoTabGraficosCls} data-vista="graficos" onclick={handleOpoVista}>Gráficos</button>
                                </div>
                            </div>
                            <template if:true={esOpoGraficos}>
                                <div class="acf-kpis-der">
                                    <div class="acf-kpi acf-tipo-box">
                                        <div class="acf-tipo-head">
                                            <div class="acf-kpi-label">Total por tipo</div>
                                            <button class="acf-btn-analitica" onclick={handleOpoTipoOrden}
                                                    title="Cambiar el orden de la lista">{opoTipoOrdenLabel}</button>
                                        </div>
                                        <template for:each={opoTipos} for:item="t">
                                            <div key={t.label} class={t.cls} data-valor={t.label}
                                                 onclick={handleOpoTipo} title="Filtrar el listado por este tipo">
                                                <span class="acf-tipo-label" title={t.label}>{t.label}</span>
                                                <span class="acf-tipo-bar-wrap"><span class="acf-tipo-bar" style={t.barStyle}></span></span>
                                                <span class="acf-tipo-num">{t.n}</span>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="acf-kpi acf-tipo-box">
                                        <div class="acf-tipo-head">
                                            <div class="acf-kpi-label">Total por subtipo</div>
                                            <button class="acf-btn-analitica" onclick={handleOpoSubtipoOrden}
                                                    title="Cambiar el orden de la lista">{opoSubtipoOrdenLabel}</button>
                                        </div>
                                        <template for:each={opoSubtipos} for:item="s">
                                            <div key={s.label} class={s.cls} data-valor={s.label}
                                                 onclick={handleOpoSubtipo} title="Filtrar el listado por este subtipo">
                                                <span class="acf-tipo-label" title={s.label}>{s.label}</span>
                                                <span class="acf-tipo-bar-wrap"><span class="acf-tipo-bar" style={s.barStyle}></span></span>
                                                <span class="acf-tipo-num">{s.n}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template if:true={esOpoListado}>
                                <!-- Botones y filtros, todos en la misma línea -->
                                <div class="acf-kpis-der acf-fila-filtros acf-filtros-der">
                                    <template for:each={opoBotones} for:item="b">
                                        <button key={b.key} class={b.cls} data-key={b.key}
                                                onclick={handleOpoBoton} title={b.title}>{b.label}</button>
                                    </template>
                                    <lightning-combobox variant="label-hidden" class="acf-exp-combo"
                                                        placeholder="Tipo" title="Filtrar por tipo"
                                                        value={opoTipoSel} options={opoTipoOpciones}
                                                        onchange={handleOpoTipoCombo}></lightning-combobox>
                                    <lightning-combobox variant="label-hidden" class="acf-exp-combo"
                                                        placeholder="Subtipo" title="Filtrar por subtipo (depende del tipo)"
                                                        value={opoSubtipoSel} options={opoSubtipoOpciones}
                                                        onchange={handleOpoSubtipoCombo}></lightning-combobox>
                                    <div class="acf-filtro-cc ts-ms-wrap">
                                        <button class="ts-ms-trigger" type="button" onclick={toggleOpoEstadoDd}
                                                title="Filtrar por uno o varios estados">
                                            <span class="ts-ms-trigger-text">{opoEstadoTriggerLabel}</span>
                                            <span class="ts-ms-caret">▾</span>
                                        </button>
                                        <template if:true={showOpoEstadoDd}>
                                            <div class="ts-ms-backdrop" onclick={closeOpoEstadoDd}></div>
                                            <div class="ts-ms-panel" onclick={stopClick}>
                                                <div class="ts-ms-actions">
                                                    <button type="button" class="ts-ms-link" onclick={handleOpoEstadoTodos}>Todos</button>
                                                </div>
                                                <div class="ts-ms-list">
                                                    <template for:each={opoEstadoOptionsView} for:item="opt">
                                                        <div key={opt.value} class={opt.optionClass}
                                                             data-value={opt.value} onclick={handleOpoEstadoToggle}>
                                                            <span class="ts-ms-check"></span>
                                                            <span class="ts-ms-label">{opt.label}</span>
                                                        </div>
                                                    </template>
                                                </div>
                                                <div class="ts-ms-foot">
                                                    <button type="button" class="slds-button slds-button_brand ts-ms-apply"
                                                            onclick={closeOpoEstadoDd}>Aplicar</button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <!-- Buscador a todo lo ancho, encima del listado -->
                                <div class="acf-buscador">
                                    <lightning-input type="search" variant="label-hidden"
                                                     placeholder="Buscar por nombre, cuenta o comercial…"
                                                     value={opoBusqueda} onchange={handleOpoBusqueda}></lightning-input>
                                </div>
                                <div class="acf-card">
                                    <template if:true={opoHayFilas}>
                                        <div class="acf-scroll">
                                            <table class="acf-tabla acf-tabla-opo">
                                                <thead>
                                                    <tr>
                                                        <th class="acf-th-izq acf-th-idx">#</th>
                                                        <th class="acf-th-izq"></th>
                                                        <th class="acf-th-izq">F. cierre</th>
                                                        <th class="acf-th-izq">Estado</th>
                                                        <th class="acf-th-izq">F. creación</th>
                                                        <th class="acf-th-cen" title="Días desde la creación">Días</th>
                                                        <th class="acf-th-izq">Asunto</th>
                                                        <th class="acf-th-izq">Cuenta</th>
                                                        <th class="acf-th-izq">Tipo</th>
                                                        <th class="acf-th-izq">Subtipo</th>
                                                        <th class="acf-th-izq">Comercial</th>
                                                        <th class="acf-th-izq">Emp. titular</th>
                                                        <th class="acf-th-cen acf-th-orden" data-col="opps" onclick={handleOpoOrden}
                                                            title="Ordenar por oportunidades abiertas de la empresa">Oport. abiertas {opoOrdenOppsIcono}</th>
                                                        <th class="acf-th-cen acf-th-orden" data-col="casos" onclick={handleOpoOrden}
                                                            title="Ordenar por casos abiertos de la empresa">Casos abiertos {opoOrdenCasosIcono}</th>
                                                        <th class="acf-th-cen">Eventos 30 días</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={opoRows} for:item="c">
                                                        <tr key={c.key} class={c.rowCls}>
                                                            <template if:true={c.esGrupo}>
                                                                <td colspan="15" class="opo-grupo">
                                                                    <span class="opo-grupo-nombre">{c.etiqueta}</span>
                                                                    <span class="opo-grupo-sub">{c.sub}</span>
                                                                </td>
                                                            </template>
                                                            <template if:true={c.esFila}>
                                                                <td class="acf-td-idx">{c.idx}</td>
                                                                <td class="acf-td-izq">
                                                                    <template if:true={c.expandible}>
                                                                        <button class="opo-ampliar" data-id={c.key}
                                                                                onclick={handleOpoExpandir} title={c.chevronTitle}>{c.botonDetalle}</button>
                                                                    </template>
                                                                    <template if:true={c.esAmpliada}>
                                                                        <span class="opo-sub-marca" title="Línea desplegada al ampliar: pertenece a la misma empresa">↳</span>
                                                                    </template>
                                                                </td>
                                                                <td class={c.fechaCls}>{c.fechaFmt}</td>
                                                                <td class="acf-td-izq acf-td-corta" title={c.estado}>{c.estado}</td>
                                                                <td class="acf-td-izq">{c.creacionFmt}</td>
                                                                <td class={c.diasCls}>{c.dias}<template if:true={c.diasAviso}><lightning-icon icon-name="utility:warning" size="xx-small" class="opo-dias-warn" alternative-text="Más de 10 días desde la creación" title="Más de 10 días desde la creación"></lightning-icon></template></td>
                                                                <td class="acf-td-izq acf-td-titulo">
                                                                    <a href="javascript:void(0);" class="acf-link"
                                                                       data-recordid={c.id} data-object={c.objeto}
                                                                       onclick={navigateToRecordNewTab}
                                                                       title={c.asunto}>{c.asunto}</a>
                                                                </td>
                                                                <td class="acf-td-izq acf-td-empresa">
                                                                    <template if:true={c.cuentaId}>
                                                                        <a href="javascript:void(0);" class="acf-link"
                                                                           data-recordid={c.cuentaId} data-object="Account"
                                                                           onclick={navigateToRecordNewTab}
                                                                           title={c.cuenta}>{c.cuenta}</a>
                                                                    </template>
                                                                </td>
                                                                <td class="acf-td-izq acf-td-corta" title={c.tipo}>{c.tipo}</td>
                                                                <td class="acf-td-izq acf-td-corta" title={c.subtipo}>{c.subtipo}</td>
                                                                <td class="acf-td-izq acf-td-corta" title={c.asesor}>{c.asesor}</td>
                                                                <td class="acf-td-izq acf-td-corta" title={c.empresaTitular}>{c.empresaTitular}</td>
                                                                <td class="acf-td-cen">
                                                                    <template if:true={c.nOpps}>
                                                                        <span class="opo-circulo-amarillo">{c.nOpps}</span>
                                                                    </template>
                                                                </td>
                                                                <td class="acf-td-cen">
                                                                    <template if:true={c.nCasos}>
                                                                        <span class="opo-circulo-amarillo">{c.nCasos}</span>
                                                                    </template>
                                                                </td>
                                                                <td class="acf-td-cen">{c.nEventos}</td>
                                                            </template>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <template if:true={opoHayMas}>
                                            <div class="opo-mas">
                                                <span>{opoMostrandoLabel}</span>
                                                <button class="acf-btn-agrupar" onclick={handleOpoMasFilas}>Mostrar 100 más</button>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={opoHayFilas}>
                                        <div class="pyg-empty">
                                            <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                            <span>No hay oportunidades abiertas para la selección.</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- CASOS -->
        <!-- PESTAÑA LEADS: candidatos no convertidos en Pendiente o Atendido, del más reciente al más antiguo -->
        <template if:true={esLeads}>
            <template if:true={leadLoading}>
                <div class="pyg-loading"><lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner></div>
            </template>
            <template if:true={leadHasError}>
                <div class="pyg-error">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                    <span>{leadError}</span>
                </div>
            </template>
            <template if:true={leadShow}>
                <div class="acf-wrap">
                    <div class="acf-contab">
                        <!-- Columna izquierda: total de leads, acumulado por usuario propietario y reparto
                             por tipo de lead (las dos listas son pinchables para filtrar y se cruzan) -->
                        <div class="acf-contab-izq">
                            <div class="acf-kpi">
                                <div class="acf-kpi-num">{leadTotal}</div>
                                <div class="acf-kpi-label">Leads pendientes y atendidos</div>
                            </div>
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Usuarios</div>
                                <template for:each={leadUsuarios} for:item="u">
                                    <div key={u.key} class={u.cls} data-key={u.key} onclick={handleLeadUsuario}>
                                        <span class="acf-user-nombre">{u.nombre}</span>
                                        <span class="acf-user-num">{u.n}</span>
                                    </div>
                                </template>
                            </div>
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Tipo de lead</div>
                                <template for:each={leadTipos} for:item="t">
                                    <div key={t.key} class={t.cls} data-key={t.key} onclick={handleLeadTipo}>
                                        <span class="acf-user-nombre">{t.nombre}</span>
                                        <span class="acf-user-num">{t.n}</span>
                                    </div>
                                </template>
                            </div>
                            <!-- Reparto por estado (Pendiente / Atendido), pinchable y sincronizado con las cajas de arriba -->
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Estado</div>
                                <template for:each={leadEstados} for:item="es">
                                    <div key={es.key} class={es.cls} data-key={es.key} onclick={handleLeadEstado}>
                                        <span class="acf-user-nombre">{es.nombre}</span>
                                        <span class="acf-user-num">{es.n}</span>
                                    </div>
                                </template>
                            </div>
                            <!-- Reparto por el campo Evento del lead (Sí / No / Sin informar), pinchable como los otros -->
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Evento</div>
                                <template for:each={leadEventos} for:item="ev">
                                    <div key={ev.key} class={ev.cls} data-key={ev.key} onclick={handleLeadEvento}>
                                        <span class="acf-user-nombre">{ev.nombre}</span>
                                        <span class="acf-user-num">{ev.n}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <!-- Columna derecha: cajas por estado, buscador y listado -->
                        <div class="acf-contab-der">
                    <!-- Cajas por estado: pinchar una filtra el listado (y marca la lista Estado de la izquierda) -->
                    <div class="acf-kpis-der">
                        <template for:each={leadKpisEstado} for:item="k">
                            <div key={k.key} class={k.cls} data-key={k.key} onclick={handleLeadEstado} title={k.title}>
                                <div class="acf-kpi-num">{k.n}</div>
                                <div class="acf-kpi-label">{k.label}</div>
                            </div>
                        </template>
                    </div>
                    <!-- Buscador con el refresco a su derecha -->
                    <div class="acf-kpis-der acf-fila-filtros">
                        <div class="acf-buscador acf-buscador-linea">
                            <lightning-input type="search" variant="label-hidden"
                                             placeholder="Buscar por nombre, empresa, email, tipo, formulario o estado…"
                                             value={leadBusqueda} onchange={handleLeadBusqueda}></lightning-input>
                        </div>
                        <div class="acf-kpis-der-refresh">
                            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refrescar"
                                                   title="Refrescar" variant="border-filled" size="small"
                                                   onclick={handleLeadRefresh}></lightning-button-icon>
                        </div>
                    </div>
                    <div class="acf-card">
                        <template if:true={leadHay}>
                            <div class="acf-scroll">
                                <!-- La tabla ocupa el ancho de la tarjeta sin scroll horizontal: las columnas
                                     cortas van a ancho fijo y las largas se recortan con puntos (texto entero
                                     al pasar el ratón) -->
                                <table class="acf-tabla acf-tabla-leads">
                                    <thead>
                                        <tr>
                                            <th class="acf-th-izq acf-th-idx">#</th>
                                            <th class="acf-th-izq lead-col-fecha">Fecha de creación</th>
                                            <th class="acf-th-der lead-col-dias" title="Días transcurridos desde la fecha de creación hasta hoy">Días</th>
                                            <th class="acf-th-cen lead-col-sit" title="Verde: creado hoy · Rojo: creado en días anteriores">Situación</th>
                                            <th class="acf-th-izq lead-col-nombre">Nombre</th>
                                            <th class="acf-th-izq lead-col-empresa">Empresa</th>
                                            <th class="acf-th-izq lead-col-tipo">Tipo de lead</th>
                                            <th class="acf-th-izq lead-col-email">Email</th>
                                            <th class="acf-th-izq lead-col-form">Nombre del formulario</th>
                                            <th class="acf-th-izq lead-col-estado">Estado</th>
                                            <th class="acf-th-izq lead-col-prop">Propietario</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={leadRows} for:item="l">
                                            <tr key={l.key} class="acf-row">
                                                <td class="acf-td-der acf-td-idx">{l.num}</td>
                                                <td class="acf-td-izq">{l.fecha}</td>
                                                <td class="acf-td-der lead-td-dias">{l.dias}</td>
                                                <td class="acf-td-cen" title={l.sitTitle}><span class={l.sitCls}></span></td>
                                                <td class="acf-td-izq" title={l.nombre}><a href="javascript:void(0);" class="acf-link" data-recordid={l.id} data-object="Lead" onclick={navigateToRecordNewTab} title={l.nombre}>{l.nombre}</a></td>
                                                <td class="acf-td-izq" title={l.empresa}>{l.empresa}</td>
                                                <td class="acf-td-izq" title={l.tipo}>{l.tipo}</td>
                                                <td class="acf-td-izq" title={l.email}>{l.email}</td>
                                                <td class="acf-td-izq" title={l.formulario}>{l.formulario}</td>
                                                <td class="acf-td-izq"><span class={l.estadoCls}>{l.estado}</span></td>
                                                <td class="acf-td-izq" title={l.propietario}>
                                                    <template if:true={l.propietarioId}>
                                                        <a href="javascript:void(0);" class="acf-link" data-recordid={l.propietarioId} data-object="User"
                                                           onclick={navigateToRecordNewTab} title={l.propietario}>{l.propietario}</a>
                                                    </template>
                                                    <template if:false={l.propietarioId}>{l.propietario}</template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={leadHay}>
                            <div class="pyg-empty">
                                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                <span>No hay leads pendientes ni atendidos.</span>
                            </div>
                        </template>
                    </div>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <template if:true={esCasos}>
            <template if:true={casLoading}>
                <div class="pyg-loading"><lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner></div>
            </template>
            <template if:true={casHasError}>
                <div class="pyg-error">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                    <span>{casError}</span>
                </div>
            </template>
            <template if:true={casShow}>
                <div class="acf-wrap">
                    <div class="acf-contab">
                        <!-- Columna izquierda: total y total por tipo de casos -->
                        <div class="acf-contab-izq">
                            <div class="acf-kpi acf-kpi-click" onclick={handleCasTotal}
                                 title="Mostrar todos los casos abiertos">
                                <div class="acf-kpi-num">{casKpiTotal}</div>
                                <div class="acf-kpi-label">Total</div>
                            </div>
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Tipo de casos</div>
                                <template for:each={casTipos} for:item="t">
                                    <div key={t.key} class={t.cls} data-key={t.key} onclick={handleCasTipo}
                                         title="Filtrar el listado por este tipo">
                                        <span class="acf-user-nombre">{t.nombre}</span>
                                        <span class="acf-user-num">{t.n}</span>
                                    </div>
                                </template>
                            </div>
                            <!-- Acumulado por estado, con el mismo color que el chip del listado -->
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Estado</div>
                                <template for:each={casEstados} for:item="e">
                                    <div key={e.key} class={e.cls} data-key={e.key} onclick={handleCasEstado}
                                         title="Filtrar el listado por este estado">
                                        <span class="acf-user-nombre"><span class={e.puntoCls}></span>{e.nombre}</span>
                                        <span class="acf-user-num">{e.n}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <!-- Columna derecha: buscador y listado -->
                        <div class="acf-contab-der">
                            <div class="acf-kpis-der acf-fila-filtros">
                                <div class="acf-buscador acf-buscador-linea">
                                    <lightning-input type="search" variant="label-hidden"
                                                     placeholder="Buscar por número, asunto, contacto, cuenta o usuario…"
                                                     value={casBusqueda} onchange={handleCasBusqueda}></lightning-input>
                                </div>
                                <button class={casMisBtnCls} onclick={handleCasMios}
                                        title="Ver solo los casos que tengo asignados">Mis casos</button>
                                <button class={casAgrUsuarioCls} onclick={handleCasAgrUsuario}
                                        title="Agrupar las filas por usuario asignado">Agrupar por usuario asignado</button>
                                <div class="acf-kpis-der-refresh">
                                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refrescar"
                                                           title="Refrescar" variant="border-filled" size="small"
                                                           onclick={handleCasRefresh}></lightning-button-icon>
                                </div>
                            </div>
                            <div class="acf-card">
                                <template if:true={casHayFilas}>
                                    <div class="acf-scroll">
                                        <table class="acf-tabla">
                                            <thead>
                                                <tr>
                                                    <th class="acf-th-izq acf-th-idx">#</th>
                                                    <th class="acf-th-izq">Fecha/Hora apertura</th>
                                                    <th class="acf-th-der">Días</th>
                                                    <th class="acf-th-izq">Número</th>
                                                    <th class="acf-th-izq">Asunto</th>
                                                    <th class="acf-th-izq">Nombre del contacto</th>
                                                    <th class="acf-th-izq">Nombre de la cuenta</th>
                                                    <th class="acf-th-izq">Tipo</th>
                                                    <th class="acf-th-izq">Estado</th>
                                                    <th class="acf-th-izq">Usuario asignado</th>
                                                    <th class="acf-th-izq">Fecha prevista</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={casRows} for:item="c">
                                                    <tr key={c.key} class="acf-row">
                                                        <template if:true={c.esGrupo}>
                                                            <td colspan="11" class="acf-td-izq acf-grupo-empresa">{c.etiqueta}</td>
                                                        </template>
                                                        <template if:false={c.esGrupo}>
                                                        <td class="acf-td-idx">{c.idx}</td>
                                                        <td class="acf-td-izq">{c.fechaApertura}</td>
                                                        <td class="acf-td-der">{c.dias}</td>
                                                        <td class="acf-td-izq">
                                                            <a href="javascript:void(0);" class="acf-link"
                                                               data-recordid={c.id} data-object="Case"
                                                               onclick={navigateToRecordNewTab}
                                                               title="Abrir el caso en una pestaña nueva">{c.numero}</a>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-titulo">
                                                            <a href="javascript:void(0);" class="acf-link"
                                                               data-recordid={c.id} data-object="Case"
                                                               onclick={navigateToRecordNewTab}
                                                               title={c.asunto}>{c.asunto}</a>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-corta" title={c.contacto}>
                                                            <template if:true={c.contactoId}>
                                                                <a href="javascript:void(0);" class="acf-link"
                                                                   data-recordid={c.contactoId} data-object="Contact"
                                                                   onclick={navigateToRecordNewTab}
                                                                   title="Abrir el contacto en una pestaña nueva">{c.contacto}</a>
                                                            </template>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-empresa" title={c.empresa}>
                                                            <template if:true={c.empresaId}>
                                                                <a href="javascript:void(0);" class="acf-link"
                                                                   data-recordid={c.empresaId} data-object="Account"
                                                                   onclick={navigateToRecordNewTab}
                                                                   title="Abrir la cuenta en una pestaña nueva">{c.empresa}</a>
                                                            </template>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-corta" title={c.tipo}>{c.tipo}</td>
                                                        <td class="acf-td-izq"><span class={c.estadoCls}>{c.estado}</span></td>
                                                        <td class="acf-td-izq acf-td-corta" title={c.asesor}>{c.asesor}</td>
                                                        <td class="acf-td-izq">{c.fechaPrevistaFmt}</td>
                                                        </template>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <template if:false={casHayFilas}>
                                    <div class="pyg-empty">
                                        <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                        <span>No hay casos abiertos para la selección.</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- PRÓXIMOS VTOS. LEGALES -->
        <template if:true={esVtos}>
            <template if:true={vtoLoading}>
                <div class="pyg-loading"><lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner></div>
            </template>
            <template if:true={vtoHasError}>
                <div class="pyg-error">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                    <span>{vtoError}</span>
                </div>
            </template>
            <template if:true={vtoShow}>
                <div class="acf-wrap">

                    <!-- CALENDARIO DE VENCIMIENTOS: SEMANA ACTUAL Y SIGUIENTE -->
                    <template if:true={hayVencCeldas}>
                        <div class="acf-card acf-venc-panel">
                            <div class="acf-venc-head">
                                <span class="acf-venc-title">Vencimientos legales de expedientes · Semana actual y siguiente</span>
                                <span class="acf-venc-badges">
                                    <template if:true={hayVencSinPresentar}>
                                        <span class="acf-venc-badge acf-venc-badge-naranja acf-venc-badge-click"
                                              onclick={handleVencSinPresentar}
                                              title="Ver los vencimientos sin presentar">{vencSinPresentarLabel}</span>
                                    </template>
                                    <span class="acf-venc-badge acf-venc-badge-azul acf-venc-badge-click"
                                          onclick={handleVencPorDelante}
                                          title="Ver los vencimientos por delante">{vencPorDelanteLabel}</span>
                                </span>
                            </div>
                            <div class="acf-venc-grid">
                                <template for:each={vtoCeldas} for:item="v">
                                    <div key={v.key} class={v.cls}>
                                        <div class="acf-venc-dia">
                                            <template if:true={v.esHoy}>
                                                <span class="acf-venc-hoy-pill">{v.etiqueta}</span>
                                            </template>
                                            <template if:false={v.esHoy}>
                                                <span>{v.etiqueta}</span>
                                                <template if:true={v.aviso}><span class="acf-venc-aviso">⚠</span></template>
                                            </template>
                                        </div>
                                        <div class={v.textoCls} data-fecha={v.key} onclick={handleVencDia} title={v.vencTitle}>
                                            <template if:true={v.num}><span class="acf-venc-num">{v.num}</span></template>
                                            <span>{v.resto}</span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <div class="acf-contab">
                        <!-- Columna izquierda: total + usuarios -->
                        <div class="acf-contab-izq">
                            <div class="acf-kpi acf-kpi-click" onclick={handleVtoTotal}
                                 title="Mostrar todos los vencimientos">
                                <div class="acf-kpi-num">{vtoKpiTotal}</div>
                                <div class="acf-kpi-label">Total vencimientos</div>
                            </div>
                            <div class="acf-card acf-user-list">
                                <div class="acf-list-title">Total por empresa titular</div>
                                <template for:each={vtoTitulares} for:item="t">
                                    <div key={t.key} class={t.cls} data-key={t.key} onclick={handleVtoTitular}>
                                        <span class="acf-user-nombre">{t.nombre}</span>
                                        <span class="acf-user-num">{t.n}</span>
                                    </div>
                                </template>
                            </div>
                            <div class="acf-card acf-user-list">
                                <template for:each={vtoAsesores} for:item="a">
                                    <div key={a.key} class={a.cls} data-key={a.key} onclick={handleVtoAsesor}>
                                        <span class="acf-user-nombre">{a.nombre}</span>
                                        <span class="acf-user-num">{a.n}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <!-- Columna derecha: cajas + buscador + listado -->
                        <div class="acf-contab-der">
                            <div class="acf-kpis-der">
                                <div class={vtoKpiVencidosCls} data-kpi="vencidos" onclick={handleVtoKpi}
                                     title="Mostrar solo los vencidos">
                                    <div class="acf-kpi-num">{vtoKpiVencidos}</div>
                                    <div class="acf-kpi-label">Total vencidos</div>
                                </div>
                                <div class={vtoKpiHoyCls} data-kpi="hoy" onclick={handleVtoKpi}
                                     title="Mostrar solo los que vencen hoy">
                                    <div class="acf-kpi-num">{vtoKpiHoy}</div>
                                    <div class="acf-kpi-label">Total hoy</div>
                                </div>
                                <div class={vtoKpiProximosCls} data-kpi="proximos" onclick={handleVtoKpi}
                                     title="Mostrar solo los próximos">
                                    <div class="acf-kpi-num">{vtoKpiProximos}</div>
                                    <div class="acf-kpi-label">Total próximamente</div>
                                </div>
                                <div class="acf-kpis-der-refresh">
                                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refrescar"
                                                           title="Refrescar" variant="border-filled" size="small"
                                                           onclick={handleVtoRefresh}></lightning-button-icon>
                                </div>
                            </div>
                            <!-- Filtro de fecha activado desde el calendario -->
                            <template if:true={hayVtoFechaFiltro}>
                                <div class="acf-fecha-chip">
                                    <span>{vtoFechaLabel}</span>
                                    <button class="acf-fecha-chip-x" onclick={handleVtoFechaClear}
                                            title="Quitar el filtro de fecha">✕</button>
                                </div>
                            </template>
                            <!-- Buscador por empresa y asesor con Mis vencimientos a su derecha -->
                            <div class="acf-kpis-der acf-fila-filtros">
                                <div class="acf-buscador acf-buscador-linea">
                                    <lightning-input type="search" variant="label-hidden"
                                                     placeholder="Buscar por empresa, asesor o asunto…"
                                                     value={vtoBusqueda} onchange={handleVtoBusqueda}></lightning-input>
                                </div>
                                <button class={vtoMisBtnCls} onclick={handleVtoMios}
                                        title="Ver solo mis vencimientos">Mis vencimientos</button>
                                <button class={vtoAgrAsesorCls} onclick={handleVtoAgrAsesor}
                                        title="Agrupar las filas por persona asignada">Agrupar por asesor</button>
                                <button class={vtoAgrTitularCls} onclick={handleVtoAgrTitular}
                                        title="Agrupar las filas por empresa titular del usuario asignado">Agrupar por empresa titular</button>
                                <!-- Rango de fecha de vencimiento desde/hasta -->
                                <div class="acf-vto-fecha">
                                    <span class="acf-vto-fecha-lbl">Fecha desde</span>
                                    <lightning-input type="date" variant="label-hidden" class="acf-aus-fechafin"
                                                     value={vtoDesde} title="Fecha de vencimiento desde"
                                                     onchange={handleVtoDesde}></lightning-input>
                                </div>
                                <div class="acf-vto-fecha">
                                    <span class="acf-vto-fecha-lbl">Fecha hasta</span>
                                    <lightning-input type="date" variant="label-hidden" class="acf-aus-fechafin"
                                                     min={vtoDesde} value={vtoHasta} title="Fecha de vencimiento hasta"
                                                     onchange={handleVtoHasta}></lightning-input>
                                </div>
                            </div>
                            <!-- Subvistas: lista o calendario mensual -->
                            <div class="acf-subtabs-vto">
                                <div class="lm-subtabs">
                                    <button class={vtoTabListaCls} data-vista="lista" onclick={handleVtoVista}>Lista</button>
                                    <button class={vtoTabCalCls} data-vista="calendario" onclick={handleVtoVista}>Calendario</button>
                                </div>
                            </div>
                            <template if:true={esVtoCalendario}>
                                <div class="acf-card">
                                    <div class="acf-cal-head">
                                        <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Mes anterior"
                                                               title="Mes anterior" variant="border-filled" size="small"
                                                               onclick={handleVtoMesPrev}></lightning-button-icon>
                                        <span class="acf-cal-titulo">{vtoCalTitulo}</span>
                                        <lightning-button-icon icon-name="utility:chevronright" alternative-text="Mes siguiente"
                                                               title="Mes siguiente" variant="border-filled" size="small"
                                                               onclick={handleVtoMesNext}></lightning-button-icon>
                                    </div>
                                    <div class="acf-cal-grid">
                                        <template for:each={vtoCalDiasSemana} for:item="d">
                                            <div key={d} class="acf-cal-diasemana">{d}</div>
                                        </template>
                                        <template for:each={vtoCalCeldas} for:item="c">
                                            <div key={c.key} class={c.cls} data-fecha={c.fecha} onclick={handleVtoCalDia}
                                                 title="Ver los vencimientos de este día en la lista">
                                                <div class="acf-cal-dia">{c.dia}</div>
                                                <template if:true={c.num}>
                                                    <span class="acf-cal-num">{c.num}</span>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template if:true={esVtoLista}>
                            <div class="acf-card">
                                <template if:true={vtoHayFilas}>
                                    <div class="acf-scroll">
                                        <table class="acf-tabla">
                                            <thead>
                                                <tr>
                                                    <th class="acf-th-izq acf-th-idx">#</th>
                                                    <th class="acf-th-izq">Vto. legal</th>
                                                    <th class="acf-th-izq">Nº días</th>
                                                    <th class="acf-th-izq">Asunto</th>
                                                    <th class="acf-th-izq">Empresa</th>
                                                    <th class="acf-th-cen">Contrato Fiscal</th>
                                                    <th class="acf-th-cen">Contrato Laboral</th>
                                                    <th class="acf-th-izq">Persona asignada</th>
                                                    <th class="acf-th-izq">Expediente</th>
                                                    <th class="acf-th-izq">Título del Expediente</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={vtoRows} for:item="c">
                                                    <tr key={c.key} class="acf-row">
                                                        <template if:true={c.esGrupo}>
                                                            <td colspan="10" class="acf-td-izq acf-grupo-empresa">{c.etiqueta}</td>
                                                        </template>
                                                        <template if:false={c.esGrupo}>
                                                        <td class="acf-td-idx">{c.idx}</td>
                                                        <td class={c.fechaCls}>{c.fechaFmt}</td>
                                                        <td class="acf-td-izq acf-dias-verde">{c.dias}</td>
                                                        <td class="acf-td-izq acf-td-titulo">
                                                            <a href="javascript:void(0);" class="acf-link"
                                                               data-recordid={c.id} data-object="Task"
                                                               onclick={navigateToRecordNewTab}
                                                               title="Abrir la tarea en una pestaña nueva">{c.asunto}</a>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-empresa">
                                                            <a href="javascript:void(0);" class="acf-link"
                                                               data-recordid={c.empresaId} data-object="Account"
                                                               onclick={navigateToRecordNewTab}
                                                               title="Abrir la empresa en una pestaña nueva">{c.empresa}</a>
                                                        </td>
                                                        <td class={c.cfCls}>{c.cfSym}</td>
                                                        <td class={c.clCls}>{c.clSym}</td>
                                                        <td class="acf-td-izq">{c.asesor}</td>
                                                        <td class="acf-td-izq">
                                                            <a href="javascript:void(0);" class="acf-link"
                                                               data-recordid={c.expedienteId} data-object="Proyecto__c"
                                                               onclick={navigateToRecordNewTab}
                                                               title="Abrir el expediente en una pestaña nueva">{c.expedienteNum}</a>
                                                        </td>
                                                        <td class="acf-td-izq acf-td-titulo" title={c.titulo}>{c.titulo}</td>
                                                        </template>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <template if:false={vtoHayFilas}>
                                    <div class="pyg-empty">
                                        <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                        <span>No hay vencimientos para la selección.</span>
                                    </div>
                                </template>
                            </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- OBLIGACIONES TRIBUTARIAS -->
        <template if:true={esObligaciones}>
            <template if:true={oblLoading}>
                <div class="pyg-loading"><lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner></div>
            </template>
            <template if:true={oblHasError}>
                <div class="pyg-error">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="small" variant="error"></lightning-icon>
                    <span>{oblError}</span>
                </div>
            </template>
            <template if:true={oblShow}>
                <div class="acf-wrap">
                    <!-- Cabecera: clientes, KPIs por periodicidad y filtros -->
                    <div class="acf-card obl-head">
                        <!-- Cada apartado: total y, debajo, cuántos de esos modelos presenta el despacho -->
                        <div class="obl-head-kpis">
                            <span class="obl-kpi"><span class="obl-chip obl-chip-m">M</span>
                                <span class="obl-kpi-txt"><span><b>{oblKpis.mensuales}</b>&nbsp;mensuales</span>
                                    <span class="obl-kpi-desp" title="De ellos, los que presenta el despacho">{oblKpis.mensualesDesp} presenta despacho</span>
                                    <span class="obl-kpi-desp obl-kpi-cli" title="De ellos, los que presenta el cliente">{oblKpis.mensualesCli} presenta cliente</span>
                                    <span class="obl-kpi-desp obl-kpi-otro" title="De ellos, los que presenta otro asesor">{oblKpis.mensualesOtro} presenta otro asesor</span></span></span>
                            <span class="obl-kpi"><span class="obl-chip obl-chip-t">T</span>
                                <span class="obl-kpi-txt"><span><b>{oblKpis.trimestrales}</b>&nbsp;trimestrales</span>
                                    <span class="obl-kpi-desp" title="De ellos, los que presenta el despacho">{oblKpis.trimestralesDesp} presenta despacho</span>
                                    <span class="obl-kpi-desp obl-kpi-cli" title="De ellos, los que presenta el cliente">{oblKpis.trimestralesCli} presenta cliente</span>
                                    <span class="obl-kpi-desp obl-kpi-otro" title="De ellos, los que presenta otro asesor">{oblKpis.trimestralesOtro} presenta otro asesor</span></span></span>
                            <span class="obl-kpi"><span class="obl-chip obl-chip-a">A</span>
                                <span class="obl-kpi-txt"><span><b>{oblKpis.anuales}</b>&nbsp;anuales</span>
                                    <span class="obl-kpi-desp" title="De ellos, los que presenta el despacho">{oblKpis.anualesDesp} presenta despacho</span>
                                    <span class="obl-kpi-desp obl-kpi-cli" title="De ellos, los que presenta el cliente">{oblKpis.anualesCli} presenta cliente</span>
                                    <span class="obl-kpi-desp obl-kpi-otro" title="De ellos, los que presenta otro asesor">{oblKpis.anualesOtro} presenta otro asesor</span></span></span>
                            <span class="obl-kpi"><span class="obl-chip obl-chip-3x">3x</span>
                                <span class="obl-kpi-txt"><span><b>{oblKpis.pagos}</b>&nbsp;pagos a cuenta</span>
                                    <span class="obl-kpi-desp" title="De ellos, los que presenta el despacho">{oblKpis.pagosDesp} presenta despacho</span>
                                    <span class="obl-kpi-desp obl-kpi-cli" title="De ellos, los que presenta el cliente">{oblKpis.pagosCli} presenta cliente</span>
                                    <span class="obl-kpi-desp obl-kpi-otro" title="De ellos, los que presenta otro asesor">{oblKpis.pagosOtro} presenta otro asesor</span></span></span>
                            <span class="obl-kpi"><span class="obl-chip obl-chip-d">D</span>
                                <span class="obl-kpi-txt"><span><b>{oblKpis.sii}</b>&nbsp;en SII</span>
                                    <span class="obl-kpi-desp" title="De ellos, los clientes cuyo SII presenta el despacho">{oblKpis.siiDesp} presenta despacho</span>
                                    <span class="obl-kpi-desp obl-kpi-cli" title="De ellos, los clientes cuyo SII presenta el cliente">{oblKpis.siiCli} presenta cliente</span>
                                    <span class="obl-kpi-desp obl-kpi-otro" title="De ellos, los clientes cuyo SII presenta otro asesor">{oblKpis.siiOtro} presenta otro asesor</span></span></span>
                        </div>
                    </div>
                    <!-- Buscador por empresa a todo lo ancho con Nueva obligación a su derecha -->
                    <div class="obl-buscador-full">
                        <div class="obl-buscador-input">
                            <lightning-input type="search" variant="label-hidden"
                                             placeholder="Buscar por empresa…"
                                             value={oblBusqueda} onchange={handleOblBusqueda}></lightning-input>
                        </div>
                        <lightning-button label="Nueva obligación" onclick={handleOblNuevaOpen}
                                          title="Dar de alta una obligación tributaria nueva"></lightning-button>
                        <!-- Filtro por situación censal AEAT (Activa/Inactiva) -->
                        <div class="ts-ms-wrap">
                            <button class="ts-ms-trigger" type="button" onclick={toggleOblCensoDd}
                                    title="Filtrar por la situación censal AEAT del contrato">
                                <span class="ts-ms-trigger-text">{oblCensoTriggerLabel}</span>
                                <span class="ts-ms-caret">▾</span>
                            </button>
                            <template if:true={showOblCensoDd}>
                                <div class="ts-ms-backdrop" onclick={closeOblCensoDd}></div>
                                <div class="ts-ms-panel" onclick={stopClick}>
                                    <div class="ts-ms-actions">
                                        <button type="button" class="ts-ms-link" onclick={handleOblCensoTodos}>Todos</button>
                                    </div>
                                    <div class="ts-ms-list">
                                        <template for:each={oblCensoOptionsView} for:item="opt">
                                            <div key={opt.value} class={opt.optionClass}
                                                 data-value={opt.value} onclick={handleOblCensoToggle}>
                                                <span class="ts-ms-check"></span>
                                                <span class="ts-ms-label">{opt.label}</span>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="ts-ms-foot">
                                        <button type="button" class="slds-button slds-button_brand ts-ms-apply"
                                                onclick={closeOblCensoDd}>Aplicar</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <lightning-button-icon icon-name="utility:refresh" alternative-text="Refrescar"
                                               title="Refrescar los datos de las cuatro subpestañas"
                                               variant="border-filled" size="small"
                                               onclick={handleOblRefresh}></lightning-button-icon>
                    </div>
                    <!-- Subpestañas: la matriz de empresas o el listado plano de impuestos -->
                    <div class="lm-subtabs obl-vista-tabs">
                        <button class={oblVistaEmpCls} data-vista="empresas" onclick={handleOblVista}
                                title="La matriz de clientes con sus modelos">Total por empresas</button>
                        <button class={oblVistaAseCls} data-vista="asesores" onclick={handleOblVista}
                                title="Totales por asesor dentro de cada periodicidad, con el desglose de empresas al ampliar">Total por asesores</button>
                        <button class={oblVistaImpCls} data-vista="impuestos" onclick={handleOblVista}
                                title="Una línea por obligación tributaria de los contratos del Total por empresas, con filtros por modelo y por quién presenta">Listado impuestos</button>
                        <button class={oblVistaCalCls} data-vista="calendario" onclick={handleOblVista}
                                title="Todos los modelos del panel con sus periodicidades y vencimientos, tengan o no registros">Catálogo modelos</button>
                        <button class={oblVistaInfoCls} data-vista="info" onclick={handleOblVista}
                                title="Qué se comprueba para marcar una incidencia en un contrato">Reglas incidencias</button>
                        <span class="obl-leyenda"><span class="obl-censo-dot obl-censo-activa">A</span>
                            Situación censal AEAT Activa</span>
                        <span class="obl-leyenda"><span class="obl-censo-dot obl-censo-inactiva">I</span>
                            Situación censal AEAT Inactiva</span>
                    </div>
                    <!-- Leyenda de territorios: el color del chip es el territorio de la
                         obligación; la letra, su periodicidad -->
                    <template if:true={esOblVistaConChips}>
                        <div class="obl-leyenda-terr">
                            <span class="obl-leyenda"><span class="obl-chip obl-chip-comun">T</span> Territorio Común</span>
                            <span class="obl-leyenda"><span class="obl-chip obl-chip-navarra">T</span> Navarra</span>
                            <span class="obl-leyenda"><span class="obl-chip obl-chip-gipuzkoa">T</span> Guipúzcoa</span>
                            <span class="obl-leyenda"><span class="obl-chip obl-chip-alava">T</span> Álava</span>

                            <!-- Exportar las reglas a PDF: abre la página ReglasIncidenciasPdf con el contenido de esta pestaña -->
                            <div class="obl-info-toolbar">
                                <button class="acf-btn-agrupar" onclick={handleOblInfoExportarPdf} disabled={oblInfoPdfGenerando}
                                        title="Abrir en una pestaña nueva el PDF de estas reglas, con su estructura y colores">{oblInfoPdfBtnLabel}</button>
                                <template if:true={oblInfoPdfUrl}>
                                    <a class="obl-cal-pdf-link" href={oblInfoPdfUrl} target="_blank" rel="noopener"
                                       title="Abrir el último PDF generado (por si el navegador ha bloqueado la pestaña)">Abrir PDF</a>
                                </template>
                            </div>
                            <div class="obl-info-bloques">
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">1. Campos del contrato que deben estar informados</div>
                                    <p>El contrato contable y fiscal debe tener <b>Consolidación fiscal</b> con Sí o No y <b>¿Operador intracomunitario?</b> con Sí o No. Cada campo vacío es una incidencia, porque sin ellos no se pueden aplicar las reglas del 202 y del 349.</p>
                                    <div class="obl-info-ejemplo">Ejemplo de aviso: "Informar el campo Consolidación fiscal del contrato (Sí o No)".</div>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">2. Situación censal AEAT inactiva</div>
                                    <p>Si el contrato tiene la <b>Situación censal AEAT</b> en Inactiva, la empresa apenas presenta modelos:</p>
                                    <ul>
                                        <li>Si el titular es <b>persona física</b>, no tiene ninguna obligación tributaria: cada modelo de alta es una incidencia.</li>
                                        <li>Si <b>no es persona física</b>, solo presenta el <b>200</b>, el <b>202</b> (salvo consolidación fiscal), el <b>232</b> y el <b>347</b>: cualquier otro modelo de alta sobra, y cada uno de esos cuatro que falte es una incidencia. El 200 y el 202 se sustituyen por los del territorio fiscal (regla 5).</li>
                                        <li>Con la situación inactiva no se aplican el resto de reglas de modelos (parejas, 111 y 190, SII, 349).</li>
                                    </ul>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">3. Modelos que van por parejas</div>
                                    <p>Un modelo periódico lleva siempre su resumen anual, y al revés. Si el contrato tiene uno de los dos y no el otro, hay incidencia.</p>
                                    <table class="obl-info-tabla">
                                        <thead><tr><th>Periódico</th><th>Anual</th><th>Qué son</th></tr></thead>
                                        <tbody>
                                            <tr><td>111</td><td>190</td><td>Retenciones de trabajo y profesionales</td></tr>
                                            <tr><td>216</td><td>296</td><td>Retenciones a no residentes</td></tr>
                                            <tr><td>123</td><td>193</td><td>Retenciones del capital mobiliario. El 193 también queda justificado por el 716 (foral)</td></tr>
                                            <tr><td>115</td><td>180</td><td>Retenciones de alquileres. El 180 también queda justificado por el 759 o el 760 (forales)</td></tr>
                                            <tr><td>303</td><td>390</td><td>IVA. En SII esta pareja no se comprueba: el 390 va por la regla del SII</td></tr>
                                        </tbody>
                                    </table>
                                    <p><b>Modelos que exigen otro en un solo sentido.</b> Aquí solo se comprueba que quien tiene el primero tenga el segundo; tener el segundo sin el primero no es incidencia.</p>
                                    <table class="obl-info-tabla">
                                        <thead><tr><th>Si tiene</th><th>Debe tener</th><th>Qué son</th></tr></thead>
                                        <tbody>
                                            <tr><td>759 o 760</td><td>180</td><td>Retenciones de alquileres forales y su resumen anual</td></tr>
                                            <tr><td>716</td><td>193</td><td>Retenciones del capital mobiliario foral y su resumen anual</td></tr>
                                            <tr><td>320</td><td>390</td><td>IVA individual de grupo y el resumen anual. En SII no se comprueba: el 390 va por la regla del SII</td></tr>
                                            <tr><td>330</td><td>SII</td><td>IVA mensual de Bizkaia y Guipúzcoa: solo lo presenta quien está en el SII, y con él no le corresponde el 303 (tenerlos juntos es incidencia)</td></tr>
                                            <tr><td>220</td><td>222 y 22A</td><td>Sociedades consolidado: exige los dos</td></tr>
                                        </tbody>
                                    </table>
                                    <div class="obl-info-ejemplo">Ejemplo de aviso: "Tiene el modelo 111 pero no el 190".</div>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">4. Retenciones obligatorias con situación censal activa</div>
                                    <p>Toda empresa con la <b>Situación censal AEAT</b> en Activa debe tener el <b>111</b> y el <b>190</b>. Sin ninguno de los dos son dos incidencias; con uno solo, se avisa como pareja incompleta. Sin situación censal informada no se exigen, pero la pareja se sigue comprobando.</p>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">5. Sociedades y personas físicas</div>
                                    <p>Si el tipo de titular <b>no es persona física</b>, el contrato debe tener el <b>200</b> (Impuesto sobre Sociedades), el <b>232</b> (operaciones vinculadas) y el <b>347</b> (operaciones con terceros). El <b>202</b> (pagos fraccionados) también, salvo que el contrato tenga <b>Consolidación fiscal = Sí</b>, porque entonces los pagos van por el grupo.</p>
                                    <p>Si el titular <b>es persona física</b>, no le corresponden el 200, el 202 ni el 232, y tampoco sus equivalentes forales 203, S90 y S91: cada uno que tenga de alta es una incidencia.</p>
                                    <p>Si el <b>CIF de la empresa empieza por E</b> (entidad en atribución de rentas, como una comunidad de bienes), tampoco le corresponden el 200, el 202 ni el 232 aunque no sea persona física: cada uno de alta es una incidencia. El 347 sí se le exige.</p>
                                    <p><b>Territorio fiscal del contrato.</b> El modelo del Impuesto sobre Sociedades y el del pago fraccionado dependen del campo <b>Territorio fiscal</b> del contrato. Las reglas anteriores del 200 y del 202 se aplican con el modelo de cada territorio:</p>
                                    <ul>
                                        <li><b>Territorio Común, Canarias y Álava</b>, o sin territorio informado: Sociedades <b>200</b> y pago fraccionado <b>202</b>.</li>
                                        <li><b>Bizkaia y Guipúzcoa</b>: Sociedades <b>200</b> y pago fraccionado <b>203</b>, en vez del 202.</li>
                                        <li><b>Navarra</b>: Sociedades <b>S90</b>, en vez del 200, y pago fraccionado <b>S91</b>, en vez del 202.</li>
                                    </ul>
                                    <p>Tener de alta el modelo de otro territorio también es incidencia: una sociedad de Guipúzcoa con el 202 avisa que le corresponde el 203, y una de Navarra con el 200 avisa que le corresponde el S90.</p>
                                    <div class="obl-info-ejemplo">Ejemplo de aviso: "No es persona física y no tiene el modelo 203 (Guipúzcoa)".</div>
                                    <ul>
                                        <li>En SII el 347 no se exige aquí sino por la regla del SII (de alta y exonerado).</li>
                                        <li>Si la empresa no tiene informado el tipo de titular, no se puede saber si es persona física: no se comprueban estos modelos y en la ficha aparece una nota que no cuenta como incidencia.</li>
                                    </ul>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">6. SII: 347 y 390 exonerados (en Canarias, 415 y 425)</div>
                                    <p>Si el contrato tiene un modelo <b>SII</b> de alta, debe tener también el <b>347</b> y el <b>390</b> de alta y marcados con <b>Exonerado = Sí</b>. Falta uno de ellos, o está de alta sin el exonerado, y hay incidencia. En la matriz esas celdas llevan el aviso al pasar el ratón y los dos modelos cuentan en la fila "Total anual excluidos".</p>
                                    <p>Si el <b>territorio fiscal</b> del contrato es <b>Canarias</b>, los modelos exonerados son los del IGIC: el <b>415</b> en lugar del 347 y el <b>425</b> en lugar del 390, con las mismas condiciones. Tener de alta el 347 o el 390 en ese caso también es incidencia.</p>
                                    <div class="obl-info-ejemplo">El Exonerado se marca desde la ficha de la empresa: al pinchar el modelo se abre la ventana de edición con el campo.</div>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">7. Operador intracomunitario</div>
                                    <p>Si el contrato tiene <b>¿Operador intracomunitario? = Sí</b>, debe tener el <b>349</b> (declaración recapitulativa). Si tiene No, el 349 no debe estar de alta.</p>
                                </div>
                                <div class="obl-info-bloque">
                                    <div class="obl-info-titulo">Dónde se ve y cómo se quita</div>
                                    <ul>
                                        <li>En el listado de empresas, un triángulo delante del círculo censal: rojo si el contrato tiene incidencias (el detalle sale al pasar el ratón) y gris claro si no.</li>
                                        <li>En la ficha del cliente, una caja bajo la cabecera azul con el total y una línea por incidencia.</li>
                                        <li>Dar de alta el modelo que falta, dar de baja el que sobra, marcar el exonerado o informar el campo del contrato quita la incidencia al refrescar.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </template>

                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-flow flow-api-name="Telemarketing_Llamadas" onstatuschange={handleTmkEstado}></lightning-flow>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Subir facturas (prototipo de subida a Google Cloud Storage, en pruebas): formulario en modal -->
        <template if:true={subirFacturasAbierto}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Cerrar" onclick={handleCerrarSubirFacturas}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Subir facturas</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-test-subir-facturas-a></c-test-subir-facturas-a>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- OCR (prototipo): lista de archivos ya subidos con vista previa y metadata, en modal -->
        <template if:true={ocrAbierto}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Cerrar" onclick={handleCerrarOcr}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">OCR</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-test-ocr-buzon></c-test-ocr-buzon>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
